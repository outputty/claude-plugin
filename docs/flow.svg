  <rect x="88" y="1260" width="80" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="128" y="1272" fill="#B0413E">no · next layer</text>
  <line x1="320" y1="1480" x2="320" y2="1526" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="280" y="1496" width="80" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="320" y="1508" fill="#5F5E5A">yes · drained</text>
</g>

<!-- ============ section: BUILD · MASTER QA ============ -->
<g id="section-build-masterqa">
  <text class="band" x="24" y="1514">BUILD · MASTER QA</text>
  <line x1="24" y1="1520" x2="836" y2="1520" stroke="#6B5BD6" stroke-opacity="0.45" stroke-width="1"/>
  <rect class="wfc" x="170" y="1530" width="300" height="46" rx="8"/>
  <text class="th" x="320" y="1550" text-anchor="middle">Master QA · Opus</text>
  <text class="ts" x="320" y="1566" text-anchor="middle">run target program · whole-diff drift</text>
  <line x1="320" y1="1576" x2="320" y2="1622" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="256" y="1592" width="128" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="320" y="1604" fill="#534AB7">layer returns</text>
</g>

<!-- ============ section: BUILD · MERGE ============ -->
<g id="section-build-merge">
  <text class="band" x="24" y="1610">BUILD · MERGE (you)</text>
  <line x1="24" y1="1616" x2="836" y2="1616" stroke="#E5E3DC" stroke-width="1"/>
  <rect class="nbox" x="170" y="1626" width="300" height="48" rx="8"/>
