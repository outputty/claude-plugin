<svg width="100%" viewBox="0 0 860 1636" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">outputty flow — top-down flowchart</title>
<desc id="d">A feature request cuts a branch and draft PR, then flows top-down through labelled sections. SPEC (gated) grounds first and forks to a simple or optional advanced grill; PLAN (gated) writes a task graph. BUILD is a sequence of sections: launch (you), then the hands-off workflow. The layer-loop section picks the next ready layer and runs its tasks as visible blocks — Execute (Haiku), QA (Sonnet), then a pass check: pass commits, fail retries once on Sonnet and escalates on a second failure. A last-layer? conditional loops back up to pick the next layer or drops to a master-QA section that checks the whole diff against product.md; then merge (you). Every section is a left-labelled band with a full-width rule. Decisions are diamonds; start and stop are pills; workflow bands carry the accent colour, interactive ones are neutral.</desc>
<style>
  text{font-family:"Anthropic Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .th{font-size:13px;font-weight:600;fill:#2C2C2A}
  .t{font-size:12px;font-weight:600;fill:#2C2C2A}
  .ts{font-size:10.5px;font-weight:400;fill:#5F5E5A}
  .band{font-size:11px;font-weight:700;fill:#534AB7;letter-spacing:.06em}
  .chip{font-size:9.5px;font-weight:700;text-anchor:middle}
  .nbox{fill:#F3F2EF;stroke:#C9C7C0;stroke-width:1.3}
  .wfc{fill:#EEEDFE;stroke:#6B5BD6;stroke-width:1.6}
  .term{fill:#EEEDFE;stroke:#6B5BD6;stroke-width:1.6}
  .stop{fill:#FBEBE9;stroke:#B0413E;stroke-width:1.6}
  .opt{fill:none;stroke:#6B5BD6;stroke-width:1.4;stroke-dasharray:5 4}
  .dia{fill:#FFFFFF;stroke:#6B5BD6;stroke-width:1.5}
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrowp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B5BD6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="2" y="2" width="856" height="1632" rx="14" fill="#FCFBF8" stroke="#E5E3DC"/>

<!-- ============ intro ============ -->
<g id="section-intro">
  <rect class="term" x="185" y="18" width="270" height="40" rx="20"/>
  <text class="th" x="320" y="43" text-anchor="middle">Feature request → outputty</text>
  <line x1="320" y1="58" x2="320" y2="84" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect class="nbox" x="170" y="84" width="300" height="46" rx="8"/>
  <text class="th" x="320" y="103" text-anchor="middle">0 · Branch + draft PR</text>
  <text class="ts" x="320" y="119" text-anchor="middle">before any work</text>
  <line x1="320" y1="130" x2="320" y2="170" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
</g>

<!-- ============ section: SPEC ============ -->
<g id="section-spec">
  <text class="band" x="24" y="156">SPEC · GATED (you)</text>
  <line x1="24" y1="162" x2="836" y2="162" stroke="#E5E3DC" stroke-width="1"/>
  <rect class="nbox" x="170" y="172" width="300" height="46" rx="8"/>
  <text class="th" x="320" y="192" text-anchor="middle">Ground first</text>
  <text class="ts" x="320" y="208" text-anchor="middle">read product.md · WebFetch</text>
  <line x1="320" y1="218" x2="320" y2="248" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
  <polygon class="dia" points="320,248 390,287 320,326 250,287"/>
  <text class="t" x="320" y="283" text-anchor="middle">Simple or</text>
  <text class="t" x="320" y="298" text-anchor="middle">advanced?</text>
  <path d="M390,287 L500,287" fill="none" stroke="#6B5BD6" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrowp)"/>
  <rect x="420" y="279" width="56" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="448" y="291" fill="#534AB7">advanced</text>
  <line x1="320" y1="326" x2="320" y2="356" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="300" y="341" width="40" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="320" y="353" fill="#5F5E5A">simple</text>
  <rect class="nbox" x="170" y="356" width="300" height="46" rx="8"/>
  <text class="th" x="320" y="376" text-anchor="middle">Simple grill · default</text>
  <text class="ts" x="320" y="392" text-anchor="middle">business, then technical</text>
  <line x1="320" y1="402" x2="320" y2="432" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect class="opt" x="500" y="242" width="332" height="150" rx="10"/>
  <text class="th" x="514" y="264" fill="#3C3489">Advanced adds</text>
  <text class="ts" x="514" y="280" fill="#534AB7">optional · dynamic workflow</text>
  <text class="t" x="514" y="304">• Why · What · How agenda</text>
  <text class="t" x="514" y="328">• Expert fan-out + adversary</text>
  <text class="ts" x="526" y="343">outputty-expert × N, outputty-adversary</text>
  <text class="ts" x="526" y="357">cite an ingested source, or drop</text>
  <text class="t" x="514" y="381">• Session synthesizes → verdict</text>
  <rect class="nbox" x="170" y="432" width="300" height="46" rx="8"/>
  <text class="th" x="320" y="452" text-anchor="middle">Decisions → product.md</text>
  <text class="ts" x="320" y="468" text-anchor="middle">thought-trail → branch trail</text>
  <line x1="320" y1="478" x2="320" y2="508" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
  <polygon class="dia" points="320,508 368,540 320,572 272,540"/>
  <text class="t" x="320" y="544" text-anchor="middle">OK?</text>
  <path d="M272,540 L150,540 L150,195 L168,195" fill="none" stroke="#888780" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <rect x="128" y="362" width="44" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="150" y="374" fill="#B0413E">revise</text>
  <line x1="320" y1="572" x2="320" y2="618" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="296" y="588" width="52" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="322" y="600" fill="#0F6E56">approve</text>
</g>

<!-- ============ section: PLAN ============ -->
<g id="section-plan">
  <text class="band" x="24" y="600">PLAN · GATED (you)</text>
  <line x1="24" y1="606" x2="836" y2="606" stroke="#E5E3DC" stroke-width="1"/>
  <rect class="nbox" x="170" y="618" width="300" height="46" rx="8"/>
  <text class="th" x="320" y="638" text-anchor="middle">2 · PLAN</text>
  <text class="ts" x="320" y="654" text-anchor="middle">task graph → derive layers</text>
  <line x1="320" y1="664" x2="320" y2="694" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
  <polygon class="dia" points="320,694 368,726 320,758 272,726"/>
  <text class="t" x="320" y="730" text-anchor="middle">OK?</text>
  <path d="M272,726 L156,726 L156,641 L168,641" fill="none" stroke="#888780" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <rect x="134" y="684" width="44" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="156" y="696" fill="#B0413E">revise</text>
  <line x1="320" y1="758" x2="320" y2="806" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="296" y="774" width="52" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="322" y="786" fill="#0F6E56">approve</text>
</g>

<!-- ============ section: BUILD · LAUNCH ============ -->
<g id="section-build-launch">
  <text class="band" x="24" y="792">BUILD · LAUNCH (you)</text>
  <line x1="24" y1="798" x2="836" y2="798" stroke="#E5E3DC" stroke-width="1"/>
  <rect class="nbox" x="170" y="808" width="300" height="48" rx="8"/>
  <text class="th" x="320" y="828" text-anchor="middle">3 · Orchestrator — launch workflow</text>
  <text class="ts" x="320" y="844" text-anchor="middle">you opt in · ultracode / approve</text>
  <line x1="320" y1="856" x2="320" y2="902" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="286" y="872" width="68" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="320" y="884" fill="#534AB7">launch (you)</text>
</g>

<!-- ============ section: BUILD · LAYER LOOP (execute → QA → retry → commit) ============ -->
<g id="section-build-layerloop">
  <text class="band" x="24" y="902">BUILD · LAYER LOOP</text>
  <line x1="24" y1="908" x2="836" y2="908" stroke="#6B5BD6" stroke-opacity="0.45" stroke-width="1"/>
  <rect class="wfc" x="170" y="918" width="300" height="44" rx="8"/>
  <text class="th" x="320" y="937" text-anchor="middle">Next ready layer</text>
  <text class="ts" x="320" y="952" text-anchor="middle">drain: pick the next unblocked layer</text>
  <line x1="320" y1="962" x2="320" y2="992" stroke="#6B5BD6" stroke-width="1.3" marker-end="url(#arrowp)"/>
  <rect class="wfc" x="170" y="992" width="300" height="44" rx="8"/>
  <text class="th" x="320" y="1011" text-anchor="middle">Execute · Haiku</text>
  <text class="ts" x="320" y="1026" text-anchor="middle">executor edits the layer's scope</text>
  <line x1="320" y1="1036" x2="320" y2="1066" stroke="#6B5BD6" stroke-width="1.3" marker-end="url(#arrowp)"/>
  <rect class="wfc" x="170" y="1066" width="300" height="44" rx="8"/>
  <text class="th" x="320" y="1085" text-anchor="middle">QA · Sonnet</text>
  <text class="ts" x="320" y="1100" text-anchor="middle">spec + ponytail-review + lenses</text>
  <line x1="320" y1="1110" x2="320" y2="1140" stroke="#6B5BD6" stroke-width="1.3" marker-end="url(#arrowp)"/>
  <polygon class="dia" points="320,1140 372,1168 320,1196 268,1168"/>
  <text class="t" x="320" y="1164" text-anchor="middle">QA</text>
  <text class="t" x="320" y="1179" text-anchor="middle">pass?</text>
  <line x1="320" y1="1196" x2="320" y2="1226" stroke="#6B5BD6" stroke-width="1.3" marker-end="url(#arrowp)"/>
  <rect x="302" y="1204" width="36" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="320" y="1216" fill="#0F6E56">yes</text>
  <rect class="wfc" x="170" y="1226" width="300" height="44" rx="8"/>
  <text class="th" x="320" y="1245" text-anchor="middle">Commit</text>
  <text class="ts" x="320" y="1260" text-anchor="middle">git add scope · close task</text>
  <!-- retry (inner loop) -->
  <path d="M372,1168 L540,1168" fill="none" stroke="#6B5BD6" stroke-width="1.3" marker-end="url(#arrowp)"/>
  <rect x="452" y="1160" width="30" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="467" y="1172" fill="#B0413E">no</text>
  <rect class="wfc" x="540" y="1146" width="250" height="44" rx="8"/>
  <text class="th" x="665" y="1165" text-anchor="middle">Retry once · Sonnet</text>
  <text class="ts" x="665" y="1180" text-anchor="middle">re-run on the QA findings</text>
  <path d="M665,1146 L665,1014 L470,1014" fill="none" stroke="#6B5BD6" stroke-width="1.5" marker-end="url(#arrowp)"/>
  <rect x="540" y="1006" width="60" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="570" y="1018" fill="#534AB7">re-run</text>
  <path d="M665,1190 L665,1216" fill="none" stroke="#B0413E" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="636" y="1196" width="58" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="665" y="1208" fill="#B0413E">2nd fail</text>
  <rect class="stop" x="540" y="1216" width="250" height="40" rx="18"/>
  <text class="th" x="665" y="1241" text-anchor="middle">Escalate on double-fail → you</text>
  <line x1="320" y1="1270" x2="320" y2="1320" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
</g>

<!-- ============ section: BUILD · LAST LAYER? ============ -->
<g id="section-build-lastlayer">
  <text class="band" x="24" y="1306">BUILD · LAST LAYER?</text>
  <line x1="24" y1="1312" x2="836" y2="1312" stroke="#6B5BD6" stroke-opacity="0.45" stroke-width="1"/>
  <polygon class="dia" points="320,1320 376,1350 320,1380 264,1350"/>
  <text class="t" x="320" y="1346" text-anchor="middle">Last</text>
  <text class="t" x="320" y="1361" text-anchor="middle">layer?</text>
  <path d="M264,1350 L128,1350 L128,977 L320,977" fill="none" stroke="#6B5BD6" stroke-width="1.5" marker-end="url(#arrowp)"/>
  <rect x="88" y="1160" width="80" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="128" y="1172" fill="#B0413E">no · next layer</text>
  <line x1="320" y1="1380" x2="320" y2="1426" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="280" y="1396" width="80" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="320" y="1408" fill="#5F5E5A">yes · drained</text>
</g>

<!-- ============ section: BUILD · MASTER QA ============ -->
<g id="section-build-masterqa">
  <text class="band" x="24" y="1414">BUILD · MASTER QA</text>
  <line x1="24" y1="1420" x2="836" y2="1420" stroke="#6B5BD6" stroke-opacity="0.45" stroke-width="1"/>
  <rect class="wfc" x="170" y="1430" width="300" height="46" rx="8"/>
  <text class="th" x="320" y="1450" text-anchor="middle">Whole diff vs product.md</text>
  <text class="ts" x="320" y="1466" text-anchor="middle">cross-task drift · fail → escalate</text>
  <line x1="320" y1="1476" x2="320" y2="1522" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="256" y="1492" width="128" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="320" y="1504" fill="#534AB7">workflow returns</text>
</g>

<!-- ============ section: BUILD · MERGE ============ -->
<g id="section-build-merge">
  <text class="band" x="24" y="1510">BUILD · MERGE (you)</text>
  <line x1="24" y1="1516" x2="836" y2="1516" stroke="#E5E3DC" stroke-width="1"/>
  <rect class="nbox" x="170" y="1526" width="300" height="48" rx="8"/>
  <text class="th" x="320" y="1546" text-anchor="middle">4 · Orchestrator — merge → ship</text>
  <text class="ts" x="320" y="1562" text-anchor="middle">distill → product.md · green-gate</text>
</g>

<!-- ============ legend ============ -->
<g id="legend">
  <rect x="24" y="1590" width="812" height="34" rx="8" fill="#FFFFFF" stroke="#E5E3DC"/>
  <rect x="38" y="1600" width="16" height="12" rx="2" fill="#F3F2EF" stroke="#C9C7C0" stroke-width="1.3"/><text class="ts" x="60" y="1610" fill="#3A3A37">interactive (you)</text>
  <rect x="188" y="1600" width="16" height="12" rx="2" fill="#EEEDFE" stroke="#6B5BD6" stroke-width="1.6"/><text class="ts" x="210" y="1610" fill="#3A3A37">hands-off workflow</text>
  <rect x="352" y="1600" width="16" height="12" rx="2" fill="none" stroke="#6B5BD6" stroke-width="1.4" stroke-dasharray="4 3"/><text class="ts" x="374" y="1610" fill="#3A3A37">optional</text>
  <polygon points="462,1600 472,1606 462,1612 452,1606" fill="#FFFFFF" stroke="#6B5BD6" stroke-width="1.5"/><text class="ts" x="480" y="1610" fill="#3A3A37">decision / gate</text>
  <rect x="590" y="1600" width="16" height="12" rx="6" fill="#FBEBE9" stroke="#B0413E" stroke-width="1.6"/><text class="ts" x="612" y="1610" fill="#3A3A37">start / stop</text>
  <text class="ts" x="712" y="1610" fill="#3A3A37">accent = workflow band</text>
</g>
</svg>
