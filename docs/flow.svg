  <rect x="24" y="1690" width="812" height="34" rx="8" fill="#FFFFFF" stroke="#E5E3DC"/>
  <rect x="38" y="1700" width="16" height="12" rx="2" fill="#F3F2EF" stroke="#C9C7C0" stroke-width="1.3"/><text class="ts" x="60" y="1710" fill="#3A3A37">interactive (you)</text>
  <rect x="188" y="1700" width="16" height="12" rx="2" fill="#EEEDFE" stroke="#6B5BD6" stroke-width="1.6"/><text class="ts" x="210" y="1710" fill="#3A3A37">hands-off band</text>
