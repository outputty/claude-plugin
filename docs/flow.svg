<svg viewBox="0 0 680 840" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">outputty flow</title>
  <desc id="d">A feature request goes through Branch and draft PR, then two human-gated phases (SPEC and PLAN, each looping back on revision), then a hands-off BUILD that retries a failed task once and escalates to a human on a second failure, and finally MERGE to shipped.</desc>
  <style>
    text{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#2B2A28;text-anchor:middle}
    .human rect,.human polygon{fill:#E6F1FB;stroke:#185FA5;stroke-width:1.5}
    .hands rect,.hands polygon{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1.5}
    .gray rect,.gray polygon{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1.5}
    .edge{fill:none;stroke:#888780;stroke-width:1.6}
    .lbl{font-size:14px;font-weight:600}
    .sub{font-size:11px;fill:#5F5E5A}
    .chip{font-size:10.5px;fill:#3B3A37}
    .lg{font-size:11.5px;text-anchor:start;fill:#3B3A37}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="664" height="824" rx="14" fill="#FBFAF7" stroke="#E5E3DC"/>

  <!-- legend (top-right whitespace) -->
  <g>
    <rect class="human" x="486" y="34" width="14" height="14" rx="3"/>
    <text class="lg" x="506" y="45">human-gated</text>
    <rect class="hands" x="486" y="60" width="14" height="14" rx="3"/>
    <text class="lg" x="506" y="71">hands-off</text>
    <rect class="gray" x="486" y="86" width="14" height="14" rx="3"/>
    <text class="lg" x="506" y="97">start / stop</text>
  </g>

  <!-- edges -->
  <path class="edge" d="M340 60 V88" marker-end="url(#arrow)"/>
  <path class="edge" d="M340 132 V170" marker-end="url(#arrow)"/>
  <path class="edge" d="M340 214 V238" marker-end="url(#arrow)"/>
  <path class="edge" d="M340 306 V330" marker-end="url(#arrow)"/>
  <path class="edge" d="M340 374 V398" marker-end="url(#arrow)"/>
  <path class="edge" d="M340 466 V492" marker-end="url(#arrow)"/>
  <path class="edge" d="M340 540 V562" marker-end="url(#arrow)"/>
  <path class="edge" d="M340 642 V674" marker-end="url(#arrow)"/>
  <path class="edge" d="M340 720 V754" marker-end="url(#arrow)"/>
  <!-- QA fail -> escalate -->
  <path class="edge" d="M400 602 H470" marker-end="url(#arrow)"/>
  <!-- SPEC revise loop -->
  <path class="edge" d="M288 272 H150 V192 H210" marker-end="url(#arrow)"/>
  <!-- PLAN revise loop -->
  <path class="edge" d="M288 432 H150 V352 H210" marker-end="url(#arrow)"/>

  <!-- edge chips -->
  <rect x="323" y="309" width="34" height="18" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="340" y="321">ok</text>
  <rect x="323" y="471" width="34" height="18" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="340" y="483">ok</text>
  <rect x="317" y="647" width="46" height="18" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="340" y="659">pass</text>
  <rect x="408" y="592" width="54" height="18" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="435" y="604">fail 2x</text>
  <rect x="124" y="223" width="52" height="18" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="150" y="235">revise</text>
  <rect x="124" y="383" width="52" height="18" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="150" y="395">revise</text>

  <!-- nodes -->
  <g class="gray"><rect x="265" y="20" width="150" height="40" rx="16"/></g>
  <text class="lbl" x="340" y="45">feature request</text>

  <g class="gray"><rect x="210" y="88" width="260" height="44" rx="8"/></g>
  <text class="lbl" x="340" y="115">Branch + draft PR</text>

  <g class="human"><rect x="210" y="170" width="260" height="44" rx="8"/></g>
  <text class="lbl" x="340" y="189">SPEC</text>
  <text class="sub" x="340" y="205">grill business + technical</text>

  <g class="human"><polygon points="340,238 392,272 340,306 288,272"/></g>
  <text class="lbl" x="340" y="277" font-size="13">spec ok?</text>

  <g class="human"><rect x="210" y="330" width="260" height="44" rx="8"/></g>
  <text class="lbl" x="340" y="349">PLAN</text>
  <text class="sub" x="340" y="365">layers of tasks</text>

  <g class="human"><polygon points="340,398 392,432 340,466 288,432"/></g>
  <text class="lbl" x="340" y="437" font-size="13">plan ok?</text>

  <g class="hands"><rect x="205" y="490" width="270" height="48" rx="8"/></g>
  <text class="lbl" x="340" y="510">BUILD · hands-off</text>
  <text class="sub" x="340" y="527">cast · execute · review</text>

  <g class="hands"><polygon points="340,562 400,602 340,642 280,602"/></g>
  <text class="lbl" x="340" y="599" font-size="13">QA pass?</text>
  <text class="sub" x="340" y="614">retry once</text>

  <g class="gray"><rect x="470" y="582" width="182" height="40" rx="16"/></g>
  <text class="lbl" x="561" y="607" font-size="13">escalate to human</text>

  <g class="hands"><rect x="205" y="674" width="270" height="48" rx="8"/></g>
  <text class="lbl" x="340" y="694">MERGE</text>
  <text class="sub" x="340" y="711">distill · green-gate · merge PR</text>

  <g class="gray"><rect x="265" y="754" width="150" height="40" rx="16"/></g>
  <text class="lbl" x="340" y="779">shipped</text>
</svg>
