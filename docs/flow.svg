<svg width="100%" viewBox="0 0 860 1736" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">outputty flow — top-down flowchart</title>
<desc id="d">A feature request cuts a branch and draft PR, then flows top-down through labelled sections. SPEC (gated) grounds first and forks to a simple or optional advanced grill; PLAN (gated) writes a task graph, optionally staging a large deliverable prototype→build→sweep; when the design genuinely forks, PLAN can run an optional simulation pass — the user selects 2–4 permutations, one simulator subagent per selection races in parallel toward the same target program, and every simulation is summarized and compared before one seeds the graph. BUILD is hands-off and needs no launch step: the orchestrator walks the layers itself. The layer-loop section picks the next ready layer and runs it as ONE builder-then-QA pair of siblings, not a per-task fan-out — one build agent (Sonnet/low, test-first) makes a single pass, then a QA agent (Sonnet/xhigh) reviews the whole diff and repairs every finding itself, then a pass check: pass commits (Haiku) — then pushes and posts a per-layer PR comment — while a fail loops back into QA&#8217;s own context to fix and re-review, the builder never returning, until a finding survives two attempts or five rounds are spent, at which point it escalates to you with a flow graph and an expected/attempted/still-failing/options summary. A last-layer? conditional loops back up to pick the next layer or drops to a master-QA section where an Opus agent runs the target program and checks the whole diff against product.yaml; then merge (you), closing with a retrospective that routes durable lessons to memory. Every section is a left-labelled band with a full-width rule. Decisions are diamonds; start and stop are pills; hands-off bands carry the accent colour, interactive ones are neutral. In SPEC, the advanced branch expands into a panel sub-flow: propose an expert slate, then a decision — more than 4 lenses stops the flow and asks you (AskUserQuestion, with a free-form option) for a narrower scope; four or fewer dispatches the experts plus the adversary as parallel subagents and synthesises a verdict.</desc>
<style>
  text{font-family:"Anthropic Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .th{font-size:13px;font-weight:600;fill:#2C2C2A}
  .t{font-size:12px;font-weight:600;fill:#2C2C2A}
  .ts{font-size:10.5px;font-weight:400;fill:#5F5E5A}
  .band{font-size:11px;font-weight:700;fill:#534AB7;letter-spacing:.06em}
  .chip{font-size:9.5px;font-weight:700;text-anchor:middle}
  .nbox{fill:#F3F2EF;stroke:#C9C7C0;stroke-width:1.3}
  .wfc{fill:#EEEDFE;stroke:#6B5BD6;stroke-width:1.6}
  .term{fill:#EEEDFE;stroke:#6B5BD6;stroke-width:1.6}
  .stop{fill:#FBEBE9;stroke:#B0413E;stroke-width:1.6}
  .opt{fill:none;stroke:#6B5BD6;stroke-width:1.4;stroke-dasharray:5 4}
  .dia{fill:#FFFFFF;stroke:#6B5BD6;stroke-width:1.5}
</style>
