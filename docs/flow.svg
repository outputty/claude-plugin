<svg width="100%" viewBox="0 0 860 1508" role="img" aria-labelledby="t d" xmlns="http://www.w3.org/2000/svg">
<title id="t">outputty flow — top-down flowchart</title>
<desc id="d">A feature request cuts a branch and draft PR, then flows top-down through labelled sections. SPEC (gated) grounds first and forks to a simple or optional advanced grill; PLAN (gated) writes a task graph. BUILD is a sequence of sections: launch (you), then the hands-off workflow — a layer-loop section picks the next ready layer, a run-layer section runs that layer's tasks (Haiku executor, then Sonnet QA agent, then commit; escalate on double-fail), a last-layer? conditional loops back up to the run-layer section for the next layer or drops to a master-QA section that checks the whole diff against product.md — then merge (you). Every section is a left-labelled band with a full-width rule. Decisions are diamonds; start and stop are pills; workflow bands carry the accent colour, interactive ones are neutral.</desc>
<style>
  text{font-family:"Anthropic Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  .th{font-size:13px;font-weight:600;fill:#2C2C2A}
  .t{font-size:12px;font-weight:600;fill:#2C2C2A}
  .ts{font-size:10.5px;font-weight:400;fill:#5F5E5A}
  .band{font-size:11px;font-weight:700;fill:#534AB7;letter-spacing:.06em}
  .chip{font-size:9.5px;font-weight:700;text-anchor:middle}
  .nbox{fill:#F3F2EF;stroke:#C9C7C0;stroke-width:1.3}
  .wfc{fill:#EEEDFE;stroke:#6B5BD6;stroke-width:1.6}
  .term{fill:#EEEDFE;stroke:#6B5BD6;stroke-width:1.6}
  .stop{fill:#FBEBE9;stroke:#B0413E;stroke-width:1.6}
  .opt{fill:none;stroke:#6B5BD6;stroke-width:1.4;stroke-dasharray:5 4}
  .dia{fill:#FFFFFF;stroke:#6B5BD6;stroke-width:1.5}
</style>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrowp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B5BD6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="2" y="2" width="856" height="1504" rx="14" fill="#FCFBF8" stroke="#E5E3DC"/>

<!-- ============ intro ============ -->
<g id="section-intro">
  <rect class="term" x="185" y="18" width="270" height="40" rx="20"/>
  <text class="th" x="320" y="43" text-anchor="middle">Feature request → outputty</text>
  <line x1="320" y1="58" x2="320" y2="72" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect class="nbox" x="170" y="74" width="300" height="46" rx="8"/>
  <text class="th" x="320" y="93" text-anchor="middle">0 · Branch + draft PR</text>
  <text class="ts" x="320" y="109" text-anchor="middle">before any work</text>
  <line x1="320" y1="120" x2="320" y2="166" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
</g>

<!-- ============ section: SPEC ============ -->
<g id="section-spec">
  <text class="band" x="24" y="152">SPEC · GATED (you)</text>
  <line x1="24" y1="158" x2="836" y2="158" stroke="#E5E3DC" stroke-width="1"/>
  <rect class="nbox" x="170" y="168" width="300" height="48" rx="8"/>
  <text class="th" x="320" y="188" text-anchor="middle">Ground first</text>
  <text class="ts" x="320" y="204" text-anchor="middle">read product.md · WebFetch</text>
  <line x1="320" y1="216" x2="320" y2="230" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
  <polygon class="dia" points="320,230 388,272 320,314 252,272"/>
  <text class="t" x="320" y="268" text-anchor="middle">Simple or</text>
  <text class="t" x="320" y="283" text-anchor="middle">advanced?</text>
  <path d="M388,272 L500,272" fill="none" stroke="#6B5BD6" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrowp)"/>
  <rect x="418" y="264" width="56" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="446" y="276" fill="#534AB7">advanced</text>
  <line x1="320" y1="314" x2="320" y2="328" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="300" y="315" width="40" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="320" y="327" fill="#5F5E5A">simple</text>
  <rect class="nbox" x="170" y="328" width="300" height="48" rx="8"/>
  <text class="th" x="320" y="348" text-anchor="middle">Simple grill · default</text>
  <text class="ts" x="320" y="364" text-anchor="middle">business, then technical</text>
  <line x1="320" y1="376" x2="320" y2="394" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect class="opt" x="500" y="224" width="332" height="150" rx="10"/>
  <text class="th" x="514" y="246" fill="#3C3489">Advanced adds</text>
  <text class="ts" x="514" y="262" fill="#534AB7">optional · dynamic workflow</text>
  <text class="t" x="514" y="286">• Why · What · How agenda</text>
  <text class="t" x="514" y="310">• Expert fan-out + adversary</text>
  <text class="ts" x="526" y="325">outputty-expert × N, outputty-adversary</text>
  <text class="ts" x="526" y="339">cite an ingested source, or drop</text>
  <text class="t" x="514" y="363">• Session synthesizes → verdict</text>
  <rect class="nbox" x="170" y="396" width="300" height="48" rx="8"/>
  <text class="th" x="320" y="416" text-anchor="middle">Decisions → product.md</text>
  <text class="ts" x="320" y="432" text-anchor="middle">thought-trail → branch trail</text>
  <line x1="320" y1="444" x2="320" y2="460" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
  <polygon class="dia" points="320,462 368,494 320,526 272,494"/>
  <text class="t" x="320" y="498" text-anchor="middle">OK?</text>
  <path d="M272,494 L150,494 L150,192 L168,192" fill="none" stroke="#888780" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <rect x="128" y="335" width="44" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="150" y="347" fill="#B0413E">revise</text>
  <line x1="320" y1="526" x2="320" y2="580" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="296" y="548" width="52" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="322" y="560" fill="#0F6E56">approve</text>
</g>

<!-- ============ section: PLAN ============ -->
<g id="section-plan">
  <text class="band" x="24" y="566">PLAN · GATED (you)</text>
  <line x1="24" y1="572" x2="836" y2="572" stroke="#E5E3DC" stroke-width="1"/>
  <rect class="nbox" x="170" y="582" width="300" height="48" rx="8"/>
  <text class="th" x="320" y="602" text-anchor="middle">2 · PLAN</text>
  <text class="ts" x="320" y="618" text-anchor="middle">task graph → derive layers</text>
  <line x1="320" y1="630" x2="320" y2="644" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
  <polygon class="dia" points="320,644 368,676 320,708 272,676"/>
  <text class="t" x="320" y="680" text-anchor="middle">OK?</text>
  <path d="M272,676 L156,676 L156,606 L168,606" fill="none" stroke="#888780" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <rect x="134" y="636" width="44" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="156" y="648" fill="#B0413E">revise</text>
  <line x1="320" y1="708" x2="320" y2="760" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="296" y="730" width="52" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="322" y="742" fill="#0F6E56">approve</text>
</g>

<!-- ============ section: BUILD · LAUNCH ============ -->
<g id="section-build-launch">
  <text class="band" x="24" y="746">BUILD · LAUNCH (you)</text>
  <line x1="24" y1="752" x2="836" y2="752" stroke="#E5E3DC" stroke-width="1"/>
  <rect class="nbox" x="170" y="762" width="300" height="50" rx="8"/>
  <text class="th" x="320" y="782" text-anchor="middle">3 · Orchestrator — launch workflow</text>
  <text class="ts" x="320" y="798" text-anchor="middle">you opt in · ultracode / approve</text>
  <line x1="320" y1="812" x2="320" y2="858" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="286" y="828" width="68" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="320" y="840" fill="#534AB7">launch (you)</text>
</g>

<!-- ============ section: BUILD · LAYER LOOP ============ -->
<g id="section-build-loop">
  <text class="band" x="24" y="868">BUILD · LAYER LOOP</text>
  <line x1="24" y1="874" x2="836" y2="874" stroke="#6B5BD6" stroke-opacity="0.45" stroke-width="1"/>
  <rect class="wfc" x="170" y="884" width="300" height="48" rx="8"/>
  <text class="th" x="320" y="904" text-anchor="middle">Next ready layer</text>
  <text class="ts" x="320" y="920" text-anchor="middle">drain: pick the next unblocked layer</text>
  <line x1="320" y1="932" x2="320" y2="1006" stroke="#6B5BD6" stroke-width="1.3" marker-end="url(#arrowp)"/>
</g>

<!-- ============ section: BUILD · RUN LAYER ============ -->
<g id="section-build-run">
  <text class="band" x="24" y="990">BUILD · RUN LAYER</text>
  <line x1="24" y1="996" x2="836" y2="996" stroke="#6B5BD6" stroke-opacity="0.45" stroke-width="1"/>
  <rect class="wfc" x="170" y="1006" width="300" height="58" rx="8"/>
  <text class="th" x="320" y="1026" text-anchor="middle">Run layer · parallel tasks</text>
  <text class="ts" x="320" y="1042" text-anchor="middle">Haiku exec → Sonnet QA → commit</text>
  <text class="ts" x="320" y="1056" text-anchor="middle">retry once</text>
  <path d="M470,1035 L530,1035" fill="none" stroke="#B0413E" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect class="stop" x="530" y="1015" width="250" height="40" rx="18"/>
  <text class="th" x="655" y="1040" text-anchor="middle">Escalate on double-fail → you</text>
  <line x1="320" y1="1064" x2="320" y2="1136" stroke="#6B5BD6" stroke-width="1.3" marker-end="url(#arrowp)"/>
</g>

<!-- ============ section: BUILD · LAST LAYER? ============ -->
<g id="section-build-postbuild">
  <text class="band" x="24" y="1122">BUILD · LAST LAYER?</text>
  <line x1="24" y1="1128" x2="836" y2="1128" stroke="#6B5BD6" stroke-opacity="0.45" stroke-width="1"/>
  <polygon class="dia" points="320,1138 376,1166 320,1194 264,1166"/>
  <text class="t" x="320" y="1163" text-anchor="middle">Last</text>
  <text class="t" x="320" y="1178" text-anchor="middle">layer?</text>
  <path d="M264,1166 L138,1166 L138,969 L320,969" fill="none" stroke="#6B5BD6" stroke-width="1.5" marker-end="url(#arrowp)"/>
  <rect x="111" y="1052" width="54" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="138" y="1064" fill="#B0413E">no · loop</text>
  <line x1="320" y1="1194" x2="320" y2="1240" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="280" y="1210" width="80" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="320" y="1222" fill="#5F5E5A">yes · drained</text>
</g>

<!-- ============ section: BUILD · MASTER QA ============ -->
<g id="section-build-masterqa">
  <text class="band" x="24" y="1252">BUILD · MASTER QA</text>
  <line x1="24" y1="1258" x2="836" y2="1258" stroke="#6B5BD6" stroke-opacity="0.45" stroke-width="1"/>
  <rect class="wfc" x="170" y="1268" width="300" height="50" rx="8"/>
  <text class="th" x="320" y="1288" text-anchor="middle">Whole diff vs product.md</text>
  <text class="ts" x="320" y="1304" text-anchor="middle">cross-task drift · fail → escalate</text>
  <line x1="320" y1="1318" x2="320" y2="1364" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="256" y="1334" width="128" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="320" y="1346" fill="#534AB7">workflow returns</text>
</g>

<!-- ============ section: BUILD · MERGE ============ -->
<g id="section-build-merge">
  <text class="band" x="24" y="1376">BUILD · MERGE (you)</text>
  <line x1="24" y1="1382" x2="836" y2="1382" stroke="#E5E3DC" stroke-width="1"/>
  <rect class="nbox" x="170" y="1392" width="300" height="50" rx="8"/>
  <text class="th" x="320" y="1412" text-anchor="middle">4 · Orchestrator — merge → ship</text>
  <text class="ts" x="320" y="1428" text-anchor="middle">distill → product.md · green-gate</text>
</g>

<!-- ============ legend ============ -->
<g id="legend">
  <rect x="24" y="1458" width="812" height="34" rx="8" fill="#FFFFFF" stroke="#E5E3DC"/>
  <rect x="38" y="1468" width="16" height="12" rx="2" fill="#F3F2EF" stroke="#C9C7C0" stroke-width="1.3"/><text class="ts" x="60" y="1478" fill="#3A3A37">interactive (you)</text>
  <rect x="188" y="1468" width="16" height="12" rx="2" fill="#EEEDFE" stroke="#6B5BD6" stroke-width="1.6"/><text class="ts" x="210" y="1478" fill="#3A3A37">hands-off workflow</text>
  <rect x="352" y="1468" width="16" height="12" rx="2" fill="none" stroke="#6B5BD6" stroke-width="1.4" stroke-dasharray="4 3"/><text class="ts" x="374" y="1478" fill="#3A3A37">optional</text>
  <polygon points="462,1468 472,1474 462,1480 452,1474" fill="#FFFFFF" stroke="#6B5BD6" stroke-width="1.5"/><text class="ts" x="480" y="1478" fill="#3A3A37">decision / gate</text>
  <rect x="590" y="1468" width="16" height="12" rx="6" fill="#FBEBE9" stroke="#B0413E" stroke-width="1.6"/><text class="ts" x="612" y="1478" fill="#3A3A37">start / stop</text>
  <text class="ts" x="712" y="1478" fill="#3A3A37">accent = workflow band</text>
</g>
</svg>
