<svg viewBox="0 0 680 970" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">outputty flow</title>
  <desc id="d">A feature request goes through Branch and draft PR, then two human-gated phases (SPEC and PLAN, each looping back on revision), then a hands-off BUILD that runs each layer of tasks: per layer it casts roles, executes and reviews, retrying a failed task once and escalating to a human on a second failure. After a layer's QA passes, if more layers remain it loops back to build the next one; only when all layers are done does it merge, update the documentation, and reach shipped.</desc>
  <style>
    text{font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#2B2A28;text-anchor:middle}
    .human rect,.human polygon{fill:#E6F1FB;stroke:#185FA5;stroke-width:1.5}
    .hands rect,.hands polygon{fill:#E1F5EE;stroke:#0F6E56;stroke-width:1.5}
    .gray rect,.gray polygon{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:1.5}
    .edge{fill:none;stroke:#888780;stroke-width:1.6}
    .lbl{font-size:14px;font-weight:600}
    .sub{font-size:11px;fill:#5F5E5A}
    .chip{font-size:10.5px;fill:#3B3A37}
    .lg{font-size:11.5px;text-anchor:start;fill:#3B3A37}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="664" height="954" rx="14" fill="#FBFAF7" stroke="#E5E3DC"/>

  <!-- legend (explicit fills: the .human/.hands/.gray rules only match shapes INSIDE a classed group) -->
  <rect x="486" y="34" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5"/>
  <text class="lg" x="506" y="45">human-gated</text>
  <rect x="486" y="60" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56"/>
  <text class="lg" x="506" y="71">hands-off</text>
  <rect x="486" y="86" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A"/>
  <text class="lg" x="506" y="97">start / stop</text>

  <!-- straight edges (center column) -->
  <path class="edge" d="M340 58 V88" marker-end="url(#arrow)"/>
  <path class="edge" d="M340 132 V168" marker-end="url(#arrow)"/>
  <path class="edge" d="M340 212 V236" marker-end="url(#arrow)"/>
  <path class="edge" d="M340 300 V324" marker-end="url(#arrow)"/>
  <path class="edge" d="M340 368 V392" marker-end="url(#arrow)"/>
  <path class="edge" d="M340 456 V482" marker-end="url(#arrow)"/>
  <path class="edge" d="M340 530 V552" marker-end="url(#arrow)"/>
  <path class="edge" d="M340 632 V646" marker-end="url(#arrow)"/>
  <path class="edge" d="M340 722 V744" marker-end="url(#arrow)"/>
  <path class="edge" d="M340 788 V824" marker-end="url(#arrow)"/>
  <path class="edge" d="M340 868 V902" marker-end="url(#arrow)"/>
  <!-- QA fail -> escalate -->
  <path class="edge" d="M400 592 H470" marker-end="url(#arrow)"/>
  <!-- SPEC revise loop -->
  <path class="edge" d="M288 268 H150 V190 H205" marker-end="url(#arrow)"/>
  <!-- PLAN revise loop -->
  <path class="edge" d="M288 424 H150 V346 H205" marker-end="url(#arrow)"/>
  <!-- more layers? yes -> loop back into BUILD (next layer) -->
  <path class="edge" d="M282 684 H150 V506 H205" marker-end="url(#arrow)"/>

  <!-- edge labels: offset to the side of each line so the arrow/line stays visible -->
  <rect x="350" y="304" width="30" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="365" y="316">ok</text>
  <rect x="350" y="461" width="30" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="365" y="473">ok</text>
  <rect x="350" y="631" width="38" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="369" y="643">pass</text>
  <rect x="350" y="724" width="54" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="377" y="736">all done</text>
  <rect x="409" y="568" width="52" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="435" y="580">fail 2x</text>
  <rect x="80" y="587" width="60" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="110" y="599">next layer</text>
  <rect x="92" y="221" width="48" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="116" y="233">revise</text>
  <rect x="92" y="377" width="48" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="116" y="389">revise</text>

  <!-- nodes -->
  <g class="gray"><rect x="265" y="18" width="150" height="40" rx="16"/></g>
  <text class="lbl" x="340" y="43">feature request</text>

  <g class="gray"><rect x="205" y="88" width="270" height="44" rx="8"/></g>
  <text class="lbl" x="340" y="115">Branch + draft PR</text>

  <g class="human"><rect x="205" y="168" width="270" height="44" rx="8"/></g>
  <text class="lbl" x="340" y="187">SPEC</text>
  <text class="sub" x="340" y="203">grill business + technical</text>

  <g class="human"><polygon points="340,236 392,268 340,300 288,268"/></g>
  <text class="lbl" x="340" y="273" font-size="13">spec ok?</text>

  <g class="human"><rect x="205" y="324" width="270" height="44" rx="8"/></g>
  <text class="lbl" x="340" y="343">PLAN</text>
  <text class="sub" x="340" y="359">task graph (deps)</text>

  <g class="human"><polygon points="340,392 392,424 340,456 288,424"/></g>
  <text class="lbl" x="340" y="429" font-size="13">plan ok?</text>

  <g class="hands"><rect x="205" y="482" width="270" height="48" rx="8"/></g>
  <text class="lbl" x="340" y="502">BUILD · per layer</text>
  <text class="sub" x="340" y="519">cast · execute · review</text>

  <g class="hands"><polygon points="340,552 400,592 340,632 280,592"/></g>
  <text class="lbl" x="340" y="589" font-size="13">QA pass?</text>
  <text class="sub" x="340" y="603">retry once</text>

  <g class="gray"><rect x="470" y="572" width="182" height="40" rx="16"/></g>
  <text class="lbl" x="561" y="597" font-size="13">escalate to human</text>

  <g class="hands"><polygon points="340,646 398,684 340,722 282,684"/></g>
  <text class="lbl" x="340" y="688" font-size="13">more layers?</text>

  <g class="hands"><rect x="205" y="744" width="270" height="44" rx="8"/></g>
  <text class="lbl" x="340" y="762">MERGE</text>
  <text class="sub" x="340" y="778">distill product.md · green-gate</text>

  <g class="hands"><rect x="205" y="824" width="270" height="44" rx="8"/></g>
  <text class="lbl" x="340" y="842">Update docs</text>
  <text class="sub" x="340" y="858">via outputty-documentation</text>

  <g class="gray"><rect x="265" y="902" width="150" height="40" rx="16"/></g>
  <text class="lbl" x="340" y="927">shipped</text>
</svg>
