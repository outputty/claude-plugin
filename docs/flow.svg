  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrowp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#6B5BD6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect x="2" y="2" width="856" height="1732" rx="14" fill="#FCFBF8" stroke="#E5E3DC"/>

<!-- ============ intro ============ -->
<g id="section-intro">
  <rect class="term" x="185" y="18" width="270" height="40" rx="20"/>
  <text class="th" x="320" y="43" text-anchor="middle">Feature request → outputty</text>
  <line x1="320" y1="58" x2="320" y2="84" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect class="nbox" x="170" y="84" width="300" height="46" rx="8"/>
  <text class="th" x="320" y="103" text-anchor="middle">0 · Branch + draft PR</text>
  <text class="ts" x="320" y="119" text-anchor="middle">before any work · states the objective</text>
  <line x1="320" y1="130" x2="320" y2="170" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
</g>

<!-- ============ section: SPEC ============ -->
<g id="section-spec">
  <text class="band" x="24" y="156">SPEC · GATED (you)</text>
  <line x1="24" y1="162" x2="836" y2="162" stroke="#E5E3DC" stroke-width="1"/>
  <rect class="nbox" x="170" y="172" width="300" height="46" rx="8"/>
  <text class="th" x="320" y="192" text-anchor="middle">Ground first</text>
  <text class="ts" x="320" y="208" text-anchor="middle">read product.yaml · WebFetch</text>
  <line x1="320" y1="218" x2="320" y2="248" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
  <polygon class="dia" points="320,248 390,287 320,326 250,287"/>
  <text class="t" x="320" y="283" text-anchor="middle">Simple or</text>
  <text class="t" x="320" y="298" text-anchor="middle">advanced?</text>
  <path d="M390,287 L512,287" fill="none" stroke="#6B5BD6" stroke-width="1.4" stroke-dasharray="5 4" marker-end="url(#arrowp)"/>
  <rect x="420" y="279" width="56" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="448" y="291" fill="#534AB7">advanced</text>
  <line x1="320" y1="326" x2="320" y2="356" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="300" y="341" width="40" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="320" y="353" fill="#5F5E5A">simple</text>
  <rect class="nbox" x="170" y="356" width="300" height="46" rx="8"/>
  <text class="th" x="320" y="376" text-anchor="middle">Simple grill · default</text>
  <text class="ts" x="320" y="392" text-anchor="middle">business, then technical</text>
  <line x1="320" y1="402" x2="320" y2="432" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect class="opt" x="500" y="238" width="332" height="322" rx="10"/>
  <text class="th" x="514" y="258" fill="#3C3489">Advanced grill — optional panel</text>
  <!-- propose slate -->
  <rect class="nbox" x="512" y="270" width="180" height="44" rx="8"/>
  <text class="th" x="602" y="290" text-anchor="middle">Propose expert slate</text>
  <text class="ts" x="602" y="305" text-anchor="middle">orthogonal lenses · reuse cache</text>
  <line x1="602" y1="314" x2="602" y2="340" stroke="#6B5BD6" stroke-width="1.3" marker-end="url(#arrowp)"/>
  <!-- too-many? decision -->
  <polygon class="dia" points="602,340 654,366 602,392 550,366"/>
  <text class="t" x="602" y="362" text-anchor="middle">More than</text>
  <text class="t" x="602" y="377" text-anchor="middle">4 lenses?</text>
  <line x1="602" y1="392" x2="602" y2="420" stroke="#6B5BD6" stroke-width="1.3" marker-end="url(#arrowp)"/>
  <rect x="584" y="399" width="36" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="602" y="411" fill="#0F6E56">no</text>
  <!-- fan-out -->
  <rect class="wfc" x="512" y="420" width="180" height="44" rx="8"/>
  <text class="th" x="602" y="439" text-anchor="middle">Fan out — expert×N</text>
  <text class="ts" x="602" y="454" text-anchor="middle">+ adversary · cite-or-drop</text>
  <line x1="602" y1="464" x2="602" y2="490" stroke="#6B5BD6" stroke-width="1.3" marker-end="url(#arrowp)"/>
  <!-- synthesize -->
  <rect class="wfc" x="512" y="490" width="180" height="44" rx="8"/>
  <text class="th" x="602" y="509" text-anchor="middle">Synthesize → verdict</text>
  <text class="ts" x="602" y="524" text-anchor="middle">report vs product.yaml</text>
  <!-- too-many branch: stop + AskUserQuestion, loop back to re-slate -->
  <path d="M654,366 L704,366" fill="none" stroke="#B0413E" stroke-width="1.4" marker-end="url(#arrow)"/>
  <rect x="664" y="349" width="30" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="679" y="361" fill="#B0413E">yes</text>
  <rect class="stop" x="704" y="350" width="122" height="34" rx="17"/>
  <text class="th" x="765" y="372" text-anchor="middle">Scope too big</text>
  <line x1="765" y1="384" x2="765" y2="410" stroke="#B0413E" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect class="nbox" x="704" y="410" width="122" height="60" rx="8"/>
  <text class="th" x="765" y="428" text-anchor="middle">AskUserQuestion</text>
  <text class="ts" x="765" y="444" text-anchor="middle">ways to split scope</text>
  <text class="ts" x="765" y="458" text-anchor="middle">+ free-form Other</text>
  <path d="M765,470 L765,542 L506,542 L506,292 L512,292" fill="none" stroke="#888780" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <rect x="586" y="534" width="94" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="633" y="546" fill="#534AB7">narrow → re-slate</text>
  <rect class="nbox" x="170" y="432" width="300" height="46" rx="8"/>
  <text class="th" x="320" y="452" text-anchor="middle">Decisions → product.yaml</text>
  <text class="ts" x="320" y="468" text-anchor="middle">thought-trail → branch trail</text>
  <line x1="320" y1="478" x2="320" y2="508" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
  <polygon class="dia" points="320,508 368,540 320,572 272,540"/>
  <text class="t" x="320" y="544" text-anchor="middle">OK?</text>
  <path d="M272,540 L150,540 L150,195 L168,195" fill="none" stroke="#888780" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <rect x="128" y="362" width="44" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="150" y="374" fill="#B0413E">revise</text>
  <line x1="320" y1="572" x2="320" y2="618" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="296" y="588" width="52" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="322" y="600" fill="#0F6E56">approve</text>
</g>

<!-- ============ section: PLAN ============ -->
<g id="section-plan">
  <text class="band" x="24" y="600">PLAN · GATED (you)</text>
  <line x1="24" y1="606" x2="836" y2="606" stroke="#E5E3DC" stroke-width="1"/>
  <rect class="nbox" x="170" y="618" width="300" height="46" rx="8"/>
  <text class="th" x="320" y="638" text-anchor="middle">2 · PLAN</text>
  <text class="ts" x="320" y="654" text-anchor="middle">task graph → layers · stage · simulate forks</text>
  <line x1="320" y1="664" x2="320" y2="694" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
  <polygon class="dia" points="320,694 368,726 320,758 272,726"/>
  <text class="t" x="320" y="730" text-anchor="middle">OK?</text>
  <path d="M272,726 L156,726 L156,641 L168,641" fill="none" stroke="#888780" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <rect x="134" y="684" width="44" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="156" y="696" fill="#B0413E">revise</text>
  <line x1="320" y1="758" x2="320" y2="806" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="296" y="774" width="52" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="322" y="786" fill="#0F6E56">approve</text>
</g>

<!-- ============ section: BUILD · LAUNCH ============ -->
<g id="section-build-launch">
  <text class="band" x="24" y="792">BUILD · LAUNCH (you)</text>
  <line x1="24" y1="798" x2="836" y2="798" stroke="#E5E3DC" stroke-width="1"/>
  <rect class="nbox" x="170" y="808" width="300" height="48" rx="8"/>
  <text class="th" x="320" y="828" text-anchor="middle">3 · Orchestrator — dispatch per layer</text>
  <text class="ts" x="320" y="844" text-anchor="middle">hands-off · no keyword, no launch card</text>
  <line x1="320" y1="856" x2="320" y2="914" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="286" y="872" width="68" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="320" y="884" fill="#534AB7">per layer</text>
</g>

<!-- ============ section: BUILD · PREFLIGHT ============ -->
<g id="section-build-preflight">
  <text class="band" x="24" y="902">BUILD · PREFLIGHT</text>
  <line x1="24" y1="908" x2="836" y2="908" stroke="#6B5BD6" stroke-opacity="0.45" stroke-width="1"/>
  <rect class="wfc" x="170" y="918" width="300" height="44" rx="8"/>
  <text class="th" x="320" y="937" text-anchor="middle">Reconcile PR &amp; comments</text>
  <text class="ts" x="320" y="952" text-anchor="middle">drift check · draft PR · push · reconcile comments</text>
  <line x1="320" y1="962" x2="320" y2="1014" stroke="#6B5BD6" stroke-width="1.3" marker-end="url(#arrowp)"/>
</g>

<!-- ============ section: BUILD · LAYER LOOP (build once → QA reviews + repairs → commit) ============ -->
<g id="section-build-layerloop">
  <text class="band" x="24" y="1002">BUILD · LAYER LOOP</text>
  <line x1="24" y1="1008" x2="836" y2="1008" stroke="#6B5BD6" stroke-opacity="0.45" stroke-width="1"/>
  <rect class="wfc" x="170" y="1018" width="300" height="44" rx="8"/>
  <text class="th" x="320" y="1037" text-anchor="middle">Next ready layer</text>
  <text class="ts" x="320" y="1052" text-anchor="middle">drain: pick the next unblocked layer</text>
  <line x1="320" y1="1062" x2="320" y2="1092" stroke="#6B5BD6" stroke-width="1.3" marker-end="url(#arrowp)"/>
  <rect class="wfc" x="170" y="1092" width="300" height="44" rx="8"/>
  <text class="th" x="320" y="1111" text-anchor="middle">Build · Sonnet (whole layer, ONE pass)</text>
  <text class="ts" x="320" y="1126" text-anchor="middle">test-first: failing test per contract → green</text>
  <line x1="320" y1="1136" x2="320" y2="1166" stroke="#6B5BD6" stroke-width="1.3" marker-end="url(#arrowp)"/>
  <rect class="wfc" x="170" y="1166" width="300" height="44" rx="8"/>
  <text class="th" x="320" y="1185" text-anchor="middle">QA · Sonnet xhigh (reviews + fixes)</text>
  <text class="ts" x="320" y="1200" text-anchor="middle">review all → fix every finding → re-review</text>
  <line x1="320" y1="1210" x2="320" y2="1240" stroke="#6B5BD6" stroke-width="1.3" marker-end="url(#arrowp)"/>
  <polygon class="dia" points="320,1240 372,1268 320,1296 268,1268"/>
  <text class="t" x="320" y="1264" text-anchor="middle">QA</text>
  <text class="t" x="320" y="1279" text-anchor="middle">pass?</text>
  <line x1="320" y1="1296" x2="320" y2="1326" stroke="#6B5BD6" stroke-width="1.3" marker-end="url(#arrowp)"/>
  <rect x="302" y="1304" width="36" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="320" y="1316" fill="#0F6E56">yes</text>
  <rect class="wfc" x="170" y="1326" width="300" height="44" rx="8"/>
  <text class="th" x="320" y="1345" text-anchor="middle">Commit · push · PR comment</text>
  <text class="ts" x="320" y="1360" text-anchor="middle">close task · per-layer mini PR desc</text>
  <!-- retry (inner loop) -->
  <path d="M372,1268 L540,1268" fill="none" stroke="#6B5BD6" stroke-width="1.3" marker-end="url(#arrowp)"/>
  <rect x="452" y="1260" width="30" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="467" y="1272" fill="#B0413E">no</text>
  <rect class="wfc" x="540" y="1246" width="250" height="44" rx="8"/>
  <text class="th" x="665" y="1265" text-anchor="middle">QA fixes, in its own context</text>
  <text class="ts" x="665" y="1280" text-anchor="middle">builder never re-dispatched</text>
  <path d="M665,1246 L665,1114 L470,1114" fill="none" stroke="#6B5BD6" stroke-width="1.5" marker-end="url(#arrowp)"/>
  <rect x="540" y="1106" width="60" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="570" y="1118" fill="#534AB7">re-run</text>
  <path d="M665,1290 L665,1316" fill="none" stroke="#B0413E" stroke-width="1.3" marker-end="url(#arrow)"/>
  <rect x="636" y="1296" width="58" height="16" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="665" y="1308" fill="#B0413E">no progress</text>
  <rect class="stop" x="540" y="1316" width="250" height="40" rx="18"/>
  <text class="th" x="665" y="1341" text-anchor="middle">Escalate on no progress (cap 5) → you</text>
  <line x1="320" y1="1370" x2="320" y2="1420" stroke="#888780" stroke-width="1.3" marker-end="url(#arrow)"/>
</g>

<!-- ============ section: BUILD · LAST LAYER? ============ -->
