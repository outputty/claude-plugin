<svg width="100%" viewBox="0 0 680 600" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Layered data-flow (example)</title>
<desc>Three sources each write a staged file into an ingest layer, load into per-unit transform tables, and converge into one shared model, which exports a file to a downstream sink.</desc>
<style>
  text { font-family: "Anthropic Sans", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .th { font-size: 14px; font-weight: 500; }
  .ts { font-size: 12px; font-weight: 400; }
  g[class] rect { stroke-width: 1; }
  .gray rect { fill: #F1EFE8; stroke: #5F5E5A; } .gray .th { fill: #2C2C2A; } .gray .ts { fill: #5F5E5A; }
  .blue rect { fill: #E6F1FB; stroke: #185FA5; } .blue .th { fill: #0C447C; } .blue .ts { fill: #185FA5; }
  .teal rect { fill: #E1F5EE; stroke: #0F6E56; } .teal .th { fill: #085041; } .teal .ts { fill: #0F6E56; }
  .purple rect { fill: #EEEDFE; stroke: #534AB7; } .purple .th { fill: #3C3489; } .purple .ts { fill: #534AB7; }
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="3" y="3" width="674" height="594" rx="14" fill="#FFFFFF" stroke="#E5E3DC" stroke-width="1"/>

<!-- arrows -->
<line x1="134" y1="90" x2="134" y2="120" stroke="#888780" stroke-width="1.25" fill="none" marker-end="url(#arrow)"/>
<line x1="340" y1="90" x2="340" y2="120" stroke="#888780" stroke-width="1.25" fill="none" marker-end="url(#arrow)"/>
<line x1="546" y1="90" x2="546" y2="120" stroke="#888780" stroke-width="1.25" fill="none" marker-end="url(#arrow)"/>
<line x1="134" y1="164" x2="134" y2="194" stroke="#888780" stroke-width="1.25" fill="none" marker-end="url(#arrow)"/>
<line x1="340" y1="164" x2="340" y2="194" stroke="#888780" stroke-width="1.25" fill="none" marker-end="url(#arrow)"/>
<line x1="546" y1="164" x2="546" y2="268" stroke="#888780" stroke-width="1.25" fill="none" marker-end="url(#arrow)"/>
<line x1="134" y1="238" x2="134" y2="268" stroke="#888780" stroke-width="1.25" fill="none" marker-end="url(#arrow)"/>
<line x1="340" y1="238" x2="340" y2="268" stroke="#888780" stroke-width="1.25" fill="none" marker-end="url(#arrow)"/>
<line x1="134" y1="312" x2="134" y2="348" stroke="#888780" stroke-width="1.25" fill="none" marker-end="url(#arrow)"/>
<line x1="340" y1="312" x2="340" y2="348" stroke="#888780" stroke-width="1.25" fill="none" marker-end="url(#arrow)"/>
<line x1="546" y1="312" x2="546" y2="348" stroke="#888780" stroke-width="1.25" fill="none" marker-end="url(#arrow)"/>
<line x1="340" y1="396" x2="340" y2="432" stroke="#888780" stroke-width="1.25" fill="none" marker-end="url(#arrow)"/>
<line x1="340" y1="474" x2="340" y2="506" stroke="#888780" stroke-width="1.25" fill="none" marker-end="url(#arrow)"/>

<!-- Row A: sources -->
<g class="gray"><rect x="42" y="46" width="184" height="44" rx="6"/><text class="th" x="134" y="65" text-anchor="middle">Source A</text><text class="ts" x="134" y="80" text-anchor="middle">external feed</text></g>
<g class="gray"><rect x="248" y="46" width="184" height="44" rx="6"/><text class="th" x="340" y="65" text-anchor="middle">Source B</text><text class="ts" x="340" y="80" text-anchor="middle">manual upload</text></g>
<g class="gray"><rect x="454" y="46" width="184" height="44" rx="6"/><text class="th" x="546" y="65" text-anchor="middle">Source C</text><text class="ts" x="546" y="80" text-anchor="middle">archive backfill</text></g>

<!-- Row B: ingest / staged files -->
<g class="blue"><rect x="42" y="120" width="184" height="44" rx="6"/><text class="th" x="134" y="139" text-anchor="middle">raw A</text><text class="ts" x="134" y="154" text-anchor="middle">staged file · ingest</text></g>
<g class="blue"><rect x="248" y="120" width="184" height="44" rx="6"/><text class="th" x="340" y="139" text-anchor="middle">raw B</text><text class="ts" x="340" y="154" text-anchor="middle">staged file · ingest</text></g>
<g class="blue"><rect x="454" y="120" width="184" height="44" rx="6"/><text class="th" x="546" y="139" text-anchor="middle">raw C</text><text class="ts" x="546" y="154" text-anchor="middle">archive · ingest</text></g>

<!-- Row C: per-unit load -->
<g class="teal"><rect x="42" y="194" width="184" height="44" rx="6"/><text class="th" x="134" y="213" text-anchor="middle">staged A</text><text class="ts" x="134" y="228" text-anchor="middle">upsert · load</text></g>
<g class="teal"><rect x="248" y="194" width="184" height="44" rx="6"/><text class="th" x="340" y="213" text-anchor="middle">staged B</text><text class="ts" x="340" y="228" text-anchor="middle">replace · load</text></g>

<!-- Row D: per-unit transform -->
<g class="teal"><rect x="42" y="268" width="184" height="44" rx="6"/><text class="th" x="134" y="287" text-anchor="middle">clean A</text><text class="ts" x="134" y="302" text-anchor="middle">upsert · transform</text></g>
<g class="teal"><rect x="248" y="268" width="184" height="44" rx="6"/><text class="th" x="340" y="287" text-anchor="middle">clean B</text><text class="ts" x="340" y="302" text-anchor="middle">replace</text></g>
<g class="teal"><rect x="454" y="268" width="184" height="44" rx="6"/><text class="th" x="546" y="287" text-anchor="middle">clean C</text><text class="ts" x="546" y="302" text-anchor="middle">replace · from archive</text></g>

<!-- Row E: shared model -->
<g class="purple"><rect x="42" y="348" width="596" height="48" rx="6"/><text class="th" x="340" y="372" text-anchor="middle">unified model (shared)</text><text class="ts" x="340" y="389" text-anchor="middle">union of clean · prefer-live · drop inactive · dedupe on conflict</text></g>

<!-- Row F: export -->
<g class="gray"><rect x="240" y="432" width="200" height="42" rx="6"/><text class="th" x="340" y="452" text-anchor="middle">export → file</text><text class="ts" x="340" y="466" text-anchor="middle">serialize · /export</text></g>

<!-- Row G: sink -->
<g class="gray"><rect x="240" y="506" width="200" height="42" rx="6"/><text class="th" x="340" y="526" text-anchor="middle">downstream sink</text><text class="ts" x="340" y="540" text-anchor="middle">loader</text></g>

<!-- legend -->
<g class="blue"><rect x="42" y="562" width="12" height="12" rx="3"/></g><text class="ts" x="60" y="572" text-anchor="start" fill="#5F5E5A">ingest / staging</text>
<g class="teal"><rect x="166" y="562" width="12" height="12" rx="3"/></g><text class="ts" x="184" y="572" text-anchor="start" fill="#5F5E5A">per-unit transform</text>
<g class="purple"><rect x="330" y="562" width="12" height="12" rx="3"/></g><text class="ts" x="348" y="572" text-anchor="start" fill="#5F5E5A">shared model</text>
<g class="gray"><rect x="438" y="562" width="12" height="12" rx="3"/></g><text class="ts" x="456" y="572" text-anchor="start" fill="#5F5E5A">external / sink</text>
</svg>
