<svg viewBox="0 0 1520 862" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <title id="t">Agent request flow — swimlane (layers x stages)</title>
  <desc id="d">Horizontal layers (interface, adapter, orchestrator workflow and activity, worker workflow and activity, memory) crossed by four vertical stages: input, processing loop, response, review. Flow is orthogonal and column-aligned. The verdict is a decision diamond with approve and reject branches; the memory layer stores the review outcome and enriches the next run.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .blue rect, .blue polygon { fill:#E6F1FB; stroke:#185FA5; stroke-width:1.8 }
      .teal rect, .teal polygon { fill:#E1F5EE; stroke:#0F6E56; stroke-width:1.8 }
      .purple rect, .purple polygon { fill:#EEEDFE; stroke:#534AB7; stroke-width:1.8 }
      .gray rect, .gray polygon { fill:#F1EFE8; stroke:#5F5E5A; stroke-width:1.8 }
      .act rect, .act polygon { stroke-dasharray:5 4 }
      .edge { fill:none; stroke:#888780; stroke-width:1.6 }
      .dash { stroke-dasharray:5 4 }
      .t    { font-size:12px; font-weight:600; fill:#1A1A1A; text-anchor:middle }
      .ts   { font-size:10px; font-weight:600; fill:#5F5E5A; text-anchor:middle }
      .lab  { font-size:12.5px; font-weight:700; fill:#FFFFFF; text-anchor:middle }
      .sub  { font-size:9px; font-weight:600; fill:#FFFFFF; text-anchor:middle }
      .stage{ font-size:14px; font-weight:700; fill:#3A3A37; text-anchor:middle }
      .alab { font-size:10px; font-weight:400; fill:#5F5E5A; text-anchor:middle }
      .chip { font-size:9.5px; font-weight:700; text-anchor:middle }
      .lvl  { font-size:11px; font-weight:700; fill:#5F5E5A; text-anchor:middle }
      .note { font-size:11px; font-weight:400; fill:#3A3A37 }
      .ttl  { font-size:17px; font-weight:700; fill:#1A1A1A }
    </style>
  </defs>

  <rect x="0" y="0" width="1520" height="862" rx="10" fill="#FCFBF8" stroke="#E5E3DC"/>
  <text class="ttl" x="22" y="32">Agent request swimlane — layers (where output is produced) x stages</text>

  <!-- layer bands; level 1 and level 2 grouped by tint -->
  <rect x="150" y="85"  width="1300" height="95"  fill="#F4F8FC"/>
  <rect x="150" y="180" width="1300" height="95"  fill="#F4F8FC"/>
  <rect x="150" y="275" width="1300" height="190" fill="#EEF7F3"/>
  <rect x="150" y="465" width="1300" height="190" fill="#F3F1FC"/>
  <rect x="150" y="655" width="1300" height="95"  fill="#F4F3EE"/>

  <!-- level brackets -->
  <text class="lvl" x="1502" y="370" transform="rotate(-90 1502 370)">level 1 · orchestrator</text>
  <text class="lvl" x="1502" y="560" transform="rotate(-90 1502 560)">level 2 · worker</text>

  <!-- layer label tabs -->
  <g>
    <rect x="10" y="107" width="132" height="50" rx="8" fill="#185FA5"/><text class="lab" x="76" y="136">Interface</text>
    <rect x="10" y="202" width="132" height="50" rx="8" fill="#185FA5"/><text class="lab" x="76" y="231">Adapter</text>
    <rect x="10" y="297" width="132" height="50" rx="8" fill="#0F6E56"/><text class="lab" x="76" y="318">Orchestrator</text><text class="sub" x="76" y="334">workflow</text>
    <rect x="10" y="392" width="132" height="50" rx="8" fill="#3F9E86"/><text class="lab" x="76" y="413">Orchestrator</text><text class="sub" x="76" y="429">activity</text>
    <rect x="10" y="487" width="132" height="50" rx="8" fill="#534AB7"/><text class="lab" x="76" y="508">Worker</text><text class="sub" x="76" y="524">workflow</text>
    <rect x="10" y="582" width="132" height="50" rx="8" fill="#8079D6"/><text class="lab" x="76" y="603">Worker</text><text class="sub" x="76" y="619">activity</text>
    <rect x="10" y="677" width="132" height="50" rx="8" fill="#5F5E5A"/><text class="lab" x="76" y="698">Memory</text><text class="sub" x="76" y="714">store</text>
  </g>

  <!-- layer separators: strong between groups, faint within a level -->
  <line x1="150" y1="180" x2="1450" y2="180" stroke="#CFCDC4" stroke-width="1.4"/>
  <line x1="150" y1="275" x2="1450" y2="275" stroke="#CFCDC4" stroke-width="1.4"/>
  <line x1="150" y1="370" x2="1450" y2="370" stroke="#E5E3DC" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="150" y1="465" x2="1450" y2="465" stroke="#CFCDC4" stroke-width="1.4"/>
  <line x1="150" y1="560" x2="1450" y2="560" stroke="#E5E3DC" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="150" y1="655" x2="1450" y2="655" stroke="#CFCDC4" stroke-width="1.4"/>
  <line x1="150" y1="85"  x2="150"  y2="750" stroke="#CFCDC4" stroke-width="1.4"/>

  <!-- stage separators + headers -->
  <line x1="430"  y1="85" x2="430"  y2="750" stroke="#A9A79F" stroke-width="1.6" stroke-dasharray="3 4"/>
  <line x1="830"  y1="85" x2="830"  y2="750" stroke="#A9A79F" stroke-width="1.6" stroke-dasharray="3 4"/>
  <line x1="1180" y1="85" x2="1180" y2="750" stroke="#A9A79F" stroke-width="1.6" stroke-dasharray="3 4"/>
  <text class="stage" x="290"  y="74">1 · input</text>
  <text class="stage" x="630"  y="74">2 · processing loop</text>
  <text class="stage" x="1005" y="74">3 · response</text>
  <text class="stage" x="1340" y="74">4 · review</text>

  <!-- ===== edges (drawn under boxes) ===== -->
  <path class="edge" d="M290,157 L290,200" marker-end="url(#arrow)"/>
  <path class="edge" d="M380,227 L630,227 L630,295" marker-end="url(#arrow)"/>
  <text class="alab" x="520" y="221">start</text>
  <path class="edge" d="M630,347 L630,390" marker-end="url(#arrow)"/>
  <text class="alab" x="664" y="372" text-anchor="start">runs orchestrator</text>
  <path class="edge" d="M630,442 L630,485" marker-end="url(#arrow)"/>
  <text class="alab" x="664" y="467" text-anchor="start">starts worker</text>
  <path class="edge" d="M630,537 L630,580" marker-end="url(#arrow)"/>
  <text class="alab" x="664" y="562" text-anchor="start">runs activity</text>
  <path class="edge dash" d="M630,677 L630,634" marker-end="url(#arrow)"/>
  <text class="alab" x="664" y="650" text-anchor="start">memory context</text>
  <path class="edge dash" d="M540,607 L518,607 L518,322 L538,322" marker-end="url(#arrow)"/>
  <text class="alab" x="506" y="476" transform="rotate(-90 506 476)">draft returns</text>
  <path class="edge" d="M630,297 L630,132 L913,132" marker-end="url(#arrow)"/>
  <text class="alab" x="772" y="125">post draft to interface</text>
  <path class="edge" d="M1005,157 L1005,200" marker-end="url(#arrow)"/>
  <text class="alab" x="1040" y="184" text-anchor="start">approve / reject</text>
  <path class="edge" d="M1005,252 L1005,287" marker-end="url(#arrow)"/>
  <text class="alab" x="1040" y="276" text-anchor="start">signal</text>
  <!-- verdict branches with white chips -->
  <path class="edge dash" d="M930,322 L722,322" marker-end="url(#arrow)"/>
  <rect x="804" y="312" width="46" height="19" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="827" y="325" fill="#B0413E">reject</text>
  <path class="edge" d="M1080,322 L1248,322" marker-end="url(#arrow)"/>
  <rect x="1139" y="312" width="54" height="19" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="1166" y="325" fill="#0F6E56">approve</text>
  <path class="edge" d="M1340,297 L1340,161" marker-end="url(#arrow)"/>
  <text class="alab" x="1348" y="240" text-anchor="start">post done</text>
  <path class="edge" d="M1340,347 L1340,675" marker-end="url(#arrow)"/>
  <text class="alab" x="1348" y="500" text-anchor="start">store</text>
  <!-- enrich future runs: one straight line in the memory lane -->
  <path class="edge dash" d="M1250,702 L724,702" marker-end="url(#arrow)"/>
  <rect x="918" y="692" width="170" height="19" rx="5" fill="#FFFFFF" stroke="#E5E3DC"/><text class="chip" x="1003" y="705" fill="#5F5E5A">enriches next run</text>

  <!-- ===== boxes ===== -->
  <!-- input -->
  <g class="blue"><rect x="200" y="107" width="180" height="50" rx="8"/></g>
  <text class="t" x="290" y="129"><tspan x="290">request</tspan><tspan x="290" dy="14" class="ts">"produce X"</tspan></text>
  <g class="blue"><rect x="200" y="202" width="180" height="50" rx="8"/></g>
  <text class="t" x="290" y="224"><tspan x="290">ack &lt; 3s</tspan><tspan x="290" dy="14" class="ts">start workflow</tspan></text>

  <!-- processing: level 1 (teal) workflow solid + activity dashed -->
  <g class="teal"><rect x="540" y="297" width="180" height="50" rx="8"/></g>
  <text class="t" x="630" y="319"><tspan x="630">attempt n</tspan><tspan x="630" dy="14" class="ts">top-level workflow</tspan></text>
  <g class="teal act"><rect x="540" y="392" width="180" height="50" rx="8"/></g>
  <text class="t" x="630" y="414"><tspan x="630">orchestrator</tspan><tspan x="630" dy="14" class="ts">calls worker</tspan></text>
  <!-- processing: level 2 (purple) workflow solid + activity dashed -->
  <g class="purple"><rect x="540" y="487" width="180" height="50" rx="8"/></g>
  <text class="t" x="630" y="509"><tspan x="630">worker task</tspan><tspan x="630" dy="14" class="ts">sub-workflow</tspan></text>
  <g class="purple act"><rect x="540" y="582" width="180" height="50" rx="8"/></g>
  <text class="t" x="630" y="604"><tspan x="630">do work</tspan><tspan x="630" dy="14" class="ts">produce draft</tspan></text>
  <!-- memory retrieve -->
  <g class="gray"><rect x="540" y="677" width="180" height="50" rx="8"/></g>
  <text class="t" x="630" y="699"><tspan x="630">retrieve memory</tspan><tspan x="630" dy="14" class="ts">enrich attempt</tspan></text>

  <!-- response -->
  <g class="blue"><rect x="915" y="107" width="180" height="50" rx="8"/></g>
  <text class="t" x="1005" y="129"><tspan x="1005">draft to interface</tspan><tspan x="1005" dy="14" class="ts">with approve / reject</tspan></text>
  <g class="blue"><rect x="915" y="202" width="180" height="50" rx="8"/></g>
  <text class="t" x="1005" y="224"><tspan x="1005">receive reply</tspan><tspan x="1005" dy="14" class="ts">to signal</tspan></text>
  <!-- conditional = diamond -->
  <g class="teal"><polygon points="1005,289 1080,322 1005,355 930,322"/></g>
  <text class="t" x="1005" y="326" font-size="11">verdict?</text>

  <!-- review -->
  <g class="blue"><rect x="1250" y="109" width="180" height="50" rx="8"/></g>
  <text class="t" x="1340" y="131"><tspan x="1340">post done</tspan><tspan x="1340" dy="14" class="ts">to thread</tspan></text>
  <g class="teal"><rect x="1250" y="297" width="180" height="50" rx="8"/></g>
  <text class="t" x="1340" y="319"><tspan x="1340">consolidate</tspan><tspan x="1340" dy="14" class="ts">attempts + verdict</tspan></text>
  <g class="gray"><rect x="1250" y="677" width="180" height="50" rx="8"/></g>
  <text class="t" x="1340" y="699"><tspan x="1340">store memory</tspan><tspan x="1340" dy="14" class="ts">what worked / failed</tspan></text>

  <!-- legend -->
  <rect x="20" y="762" width="1480" height="86" rx="8" fill="#FFFFFF" stroke="#E5E3DC"/>
  <text class="note" x="36" y="784" font-weight="700">Layers = where output is produced or triggered (not where the operation runs). Stages run left to right; the loop repeats stages 2-3 until approve.</text>
  <g>
    <rect x="36" y="794" width="16" height="12" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.6"/><text class="note" x="58" y="804">Interface / Adapter (I/O surface)</text>
    <rect x="240" y="794" width="16" height="12" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.6"/><text class="note" x="262" y="804">level 1 · orchestrator</text>
    <rect x="400" y="794" width="16" height="12" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.6"/><text class="note" x="422" y="804">level 2 · worker</text>
    <rect x="552" y="794" width="16" height="12" rx="2" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1.6"/><text class="note" x="574" y="804">memory</text>
    <rect x="672" y="794" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#3A3A37" stroke-width="1.8"/><text class="note" x="694" y="804">solid = workflow</text>
    <rect x="836" y="794" width="16" height="12" rx="2" fill="#FFFFFF" stroke="#3A3A37" stroke-width="1.8" stroke-dasharray="4 3"/><text class="note" x="858" y="804">dashed = activity</text>
    <polygon points="1018,800 1029,806 1018,812 1007,806" fill="#FFFFFF" stroke="#3A3A37" stroke-width="1.6"/><text class="note" x="1038" y="804">decision</text>
  </g>
  <text class="note" x="36" y="836">Columns align per stage so the path reads down then right. Memory loop: review stores the outcome; the next run retrieves it first, so reject feedback compounds across runs.</text>
</svg>
