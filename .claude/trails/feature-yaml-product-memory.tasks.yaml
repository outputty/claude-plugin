  brief: "End state: every instruction that told an agent to read a product doc tells it to query one. This is the half that makes the format pay: a YAML file nobody queries costs the same read the markdown did. 24 files name the docs; the dense ones are grill/SKILL.md (13 refs), spec.md (12), protocol.md (11), README.md (11), plan.md (9), audit/SKILL.md (7), agents/outputty-docs.md (7), master-qa (6). bootstrap writes YAML. The README goes through the documentation skill, never hand-edited. docs/flow.svg and skills/diagram/examples/flowchart.svg render the doc filenames as text, so redraw them via the diagram skill. ALSO REWRITE .claude-plugin/marketplace.json's DESCRIPTION TEXT (its format stays JSON — only the prose changes): today it claims 'No third-party dependencies', which is now false because tasks.js and docs.js require the bun runtime, and it describes product memory as 'four docs: product.md, roadmap.md, architecture.md, lessons.md', which this migration makes stale. That text is what a user reads before installing, so it shipping false is the worst kind of stale. The FORMAT of marketplace.json, hooks.json, settings.json, package.json and .oxlintrc.json is fixed by Claude Code, pnpm and oxlint — do not convert any of them to YAML. STOP and report if a reference cannot become a query because the reader genuinely needs the whole file."
