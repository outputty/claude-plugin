  id: t-graph-path
  title: "Resolve the task graph per feature, not per branch"
  status: done
  brief: "End state: tasks.js finds the ONE graph for the feature no matter which branch of the stack is checked out. Today taskFile() derives the path from the current branch, but BUILD publishes one branch per layer (feature/x-l1, -l2, ...), so standing on a layer branch silently creates a fresh EMPTY graph and the whole ledger vanishes. Verified live: on feature/yaml-product-memory-l1, 'tasks.js add' wrote a new feature-yaml-product-memory-l1.tasks.yaml holding one task while the real 7-task graph sat untouched beside it, and 'schedule' reported that single task as the entire plan. This is the same class as the slashed-branch bug t-graph already fixed: a derived path that silently resolves to nothing. Strip a trailing -l<N> layer suffix when resolving, and if the resolved graph does not exist while a sibling feature graph does, fail loud naming it rather than creating an empty one. Add a driver.mjs check so a layer branch cannot silently fork the ledger again."
  discovered_from: t-graph
