  id: t-sets-shape
  title: "Let docs.js query a sectioned set, not just a flat list"
  status: done
  brief: "End state: docs.js reads a set whose YAML is a MAPPING of sections, not only a flat list. Today loadRecords assumes a list and dies with a raw TypeError ('loadRecords(set).filter is not a function') on a mapping — verified live against a product-shaped fixture. That breaks product and architecture, which product-template.md itself defines as prose sections plus records, and it violates fail-loud: a TypeError is not a stated error. Shape: a mapping set is queried by section — 'docs.js product --section language --term Layer' returns that section's matching records; a prose section returns its text. A list-shaped set keeps working unchanged with no --section. A missing section, or an omitted --section on a mapping set, fails loud and names the sections that exist. This ALSO subsumes the 'trail' set QA deferred: a trail is four sections, so it needs no special case once sections work. Update product-template.md's shape table and add tests to docs.test.js."
  discovered_from: t-query
