core_objective: |
  The plugin grew fast (v0.11→0.13); a self-scan for overlap/redundancy/over-explanation found one live
  contradiction + concentrated verbosity. Fix all findings.

  Keep the "verified live" evidence notes (intentional) — cut duplication and verbosity, not rationale.

  This trail predates the four-section shape — it originally carried a numbered "Findings → fixes" list
  (finding paired with its fix) rather than settled question/answer decisions; each numbered finding is
  carried below as one decision, with the finding as `question` and the fix as `answer`.

decisions:
  - question: "`tasks.md:22` contradiction"
    answer: |
      stale escalation ladder ("try 4 Opus layer step-back") contradicts v0.12.0 (no Opus, no posture
      ladder, ≤3 rounds → user). Line 19 "always-run … over-engineering checks" also stale. → point to
      build.md's policy, reconcile.
    link: ""
  - question: Over-engineering tags duplicated (`outputty-qa` charter ⟷ `qa` skill, verbatim).
    answer: |
      → canonical taxonomy in the audit playbook (the shared lens library); review points, qa anchors to
      it.
    link: ""
  - question: verify-by-running restated in 8 files
    answer: |
      subagent charters justified; trim the main-session restatements (grill) that already inherit
      protocol.md.
    link: ""
  - question: "`build.md` (346 lines)"
    answer: |
      model policy stated 7×; the COMMIT step re-explains pr-description snapshot rules that live in
      pr-description.md. → state once + point.
    link: ""
  - question: "`documentation/writing.md` ⟷ its SKILL.md — same sentences."
    answer: |
      → writing.md keeps only the unique how.
    link: ""
  - question: "`diagram/SKILL.md:69-82` loops — one point 3× over 14 lines."
    answer: |
      → cut to ~4.
    link: ""
  - question: Mermaid-vs-SVG in ~5 files
    answer: |
      low value; light trim where clearly redundant, protocol stays source.
    link: ""
  - question: "Minors"
    answer: |
      diagram ❌/✅ pair + opt-in restatement, expert trailing re-assertion.
    link: ""
