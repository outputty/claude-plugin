core_objective: |
  feature/yaml-product-memory — product memory becomes queryable records instead of prose

  Planned-at: 1981ee2

  Every product-memory surface outputty owns is YAML records, and every lookup goes through a dedicated
  YAML tool instead of a whole-file read. The pain is concrete: `lessons.md` is 1494 lines under two
  headings, so "which lessons touched `hooks/protocol.md`?" costs the whole file. Reaching the end means
  the same question is one command, and the format ships in the template every repo gets.

decisions:
  - question: What "core files" covers
    answer: |
      the product-memory docs plus the task graph, not the tool-owned configs. Grepped the Claude Code
      2.1.224 binary: `marketplace.json` 57 hits, `hooks.json` 36, `settings.json` 337, `plugin.json`
      112, and zero YAML variants of any.
    link: "Out of scope, below."
  - question: Why YAML and not prettier markdown
    answer: |
      the goal is filtering and targeted editing on large files, which needs records. Prose in a YAML
      string is prose you still read whole.
    link: ""
  - question: The YAML runtime is bun
    answer: |
      `Bun.YAML.parse`/`stringify` are built in (bun 1.3.14). Node 26.5.0 has no YAML module, and the
      installed plugin cache carries no `node_modules` across all 10 cached versions, so a library
      dependency is unreachable at runtime.
    link: ""
  - question: Hooks stay on `node`
    answer: |
      no hook parses doc or task-graph content; all ten read JSON from stdin, which is Claude Code's
      protocol. Moving them to bun reproduces the 0.44.1 failure: a hook that cannot launch fails
      non-blocking, so all ten guards would stop firing silently on a machine without bun.
    link: "`lessons.md` §0.44.1"
  - question: "`require-grill.js` keeps a text-shape check"
    answer: |
      it asks "does this trail record a decision", which a regex over the YAML answers exactly as well
      as it answered over the markdown. No parser, no bun.
    link: "`hooks/require-grill.js:53-61`"
  - question: Agents author the docs as YAML text; only the task graph is machine-written
    answer: |
      `Bun.YAML.stringify` escapes a multi-line body into one quoted line rather than emitting a `|`
      block, which would reintroduce JSONL's unreadability in the field that hurts most. `parse` reads
      `|` correctly, so hand-authored blocks round-trip.
    link: ""
  - question: Diagrams leave the docs
    answer: |
      a new `architecture/` folder holds the graphs and the YAML references them by path. One Mermaid
      block exists in `.claude/` today (architecture.md's flow-at-a-glance).
    link: ""
  - question: This changes the plugin's format, not just this repo's files
    answer: |
      `references/product-template.md` is the canonical shape `spec.md`, `bootstrap` and the merge
      distill all write from, so every repo outputty runs in gets YAML docs. 24 files name the docs; the
      writers and readers move with the format.
    link: ""
  - question: This trail is markdown
    answer: |
      the YAML trail format is what this branch builds, and there is no tool to read it yet. It converts
      as part of the build, as the first real test of the new format.
    link: ""
not_yet_specified:
  - "The docs query CLI's command surface — what an agent types to ask each doc a question, and how much
    of it is one tool versus one per doc."
  - "Whether `claims/` stays one file per claim or collapses into a single `claims.yaml`. One-per-file
    already gives targeted loading, so the win is unclear."
  - "How `examples.md` carries its 8 JSON blocks as YAML without the escaping problem above."
  - "`docs/flow.svg` and `skills/diagram/examples/flowchart.svg` render the doc filenames as text, so
    they go stale on rename. Redraw now or at merge is unsettled."
  - "What the readers are told to do instead of reading whole. A YAML file nobody queries costs the same
    read the markdown did, so the instruction change is the half that makes the format pay."
out_of_scope:
  - item: "`marketplace.json`, `hooks.json`, `settings.json`, `package.json`, `.oxlintrc.json`"
    reason: "Claude Code, pnpm and oxlint fix these filenames and formats."
  - item: "`skills/*/SKILL.md`, `agents/*.md`, `hooks/protocol.md`"
    reason: "Claude Code loads them as markdown."
  - item: "Moving the ten hooks to bun"
    reason: "none of them parse YAML, and the cost is silent guard failure."

tasks:
  - deps: []
    scope:
      - skills/outputty
    id: t-query
    title: Define the YAML record shapes and build the docs query tool
    status: done
    brief: "End state: references/product-template.md defines the YAML shape for each product-memory surface (product, roadmap, architecture, lessons, claims, examples, trail), and skills/outputty/docs.js answers a query against any of them without reading the file whole. Runs on bun for Bun.YAML.parse. Read-only: it never writes a doc. Include a Mermaid diagram of the record sets and the one query path. Verified constraint to carry into the template: Bun.YAML.stringify escapes a multi-line string into one quoted line instead of emitting a | block, so docs are authored as YAML text and stringify is never used on prose. Tests in skills/outputty/docs.test.js, wired into package.json's test script beside tasks.test.js. Do NOT touch tasks.js (t-graph owns it)."
    contract: "In: docs.js <set> [--<field> <value>] [--json]. Out: the matching records, JSON with --json, else one line per record. Worked example is .claude/examples.md 'A product-doc query': docs.js lessons --files hooks/protocol.md --json over a two-record set returns only the record whose files contain that path."
    stage: prototype
  - deps: []
    scope:
      - skills/outputty
      - hooks
      - agents
      - .claude/skills
    id: t-graph
    title: Move the task graph from JSONL to YAML
    status: done
    brief: "End state: the task graph is .claude/trails/<branch>.tasks.yaml in BLOCK style — one field per line, readable and hand-editable. Flow-style (a JSON object per list item) is valid YAML but delivers none of the readability this feature exists for, so it is wrong. tasks.js runs on bun and uses Bun.YAML.parse / Bun.YAML.stringify(tasks, null, 2); drop the dual jsonl/yaml format branch, there is one format. ready and schedule stay untouched. Because tasks.js moves to bun, every 'node .../tasks.js' invocation in skills/outputty/*.md and agents/*.md must become 'bun' — the commit agent runs it immediately after this layer, so a missed call site breaks the next step. hooks/require-grill.js matches the new extension and keeps its text-shape regex on the trail, staying on node. Also fixed: taskFile() slugifies a slashed branch name, and a missing explicitly-named graph fails loud. Do NOT touch the other nine hooks."
    contract: "In: .claude/trails/<branch>.tasks.yaml. Out: schedule --json layers identical to today's JSONL output for the same tasks. Worked example is .claude/examples.md 'A task line (the graph's unit)': the t-1 record in, [[{id: t-1, ...}]] out."
    lenses:
      - security
  - deps:
      - t-query
      - t-sets-shape
    scope:
      - .claude
      - skills/outputty
    id: t-simple-docs
    title: Convert the docs that are already records
    status: done
    brief: "End state: roadmap.yaml, examples.yaml, product.yaml and claims/*.yaml replace their markdown, each matching the shape t-query defined. claims/ stays one file per claim: targeted loading already works, so collapsing it wins nothing. product.yaml keeps the North Star as a | block and the Language glossary as records. docs.js queries all four. Delete the markdown originals rather than leaving them beside the YAML: two copies of one decision drift in two directions."
    contract: "In: docs.js roadmap --status shipped --json. Out: the shipped rows as records, each with feature, status, depends_on, notes."
  - deps:
      - t-query
      - t-sets-shape
    scope:
      - .claude
    id: t-architecture
    title: Convert architecture and move its diagrams to their own folder
    status: done
    brief: "End state: architecture.yaml holds the prose sections as | blocks and the two genuine record sets as records: protocols (7 seams, each from/to/in/out) and memory_surfaces (5, each path/holds/lifecycle). .claude/architecture/ holds the graphs and the YAML references them by path. One Mermaid block exists in .claude/ today, the flow-at-a-glance, which becomes architecture/flow.mmd. This task establishes the prose-in-YAML convention that t-lessons and t-trails reuse, so state it in the template. Delete the markdown original."
    contract: "In: docs.js architecture --section protocols --protocol 'PLAN -> tasks.js' --json. Out: that seam's record, with from, to, in and out as separate fields rather than one prose line. Architecture is a SECTIONED set (t-sets-shape), so the query names its section; a prose section returns its text."
  - deps:
      - t-architecture
    scope:
      - .claude
    id: t-lessons
    title: Convert the 1494-line lessons chronology
    status: done
    brief: "End state: lessons.yaml replaces lessons.md. Every chronology entry becomes a record: version, title, kind, files, body as a | block using t-architecture's convention. No entry is dropped, and the done-condition is that the entry count out equals the entry count in. Append-only semantics preserved. This is the file the whole feature exists for: 1494 lines under two headings today. Delete the markdown original. STOP and report the entry if any of them resists the record shape, rather than forcing it."
    contract: "In: docs.js lessons --files hooks/protocol.md --json. Out: only records whose files list contains that path. Worked example is .claude/examples.md 'A product-doc query'."
  - deps:
      - t-lessons
    scope:
      - .claude/trails
      - skills/outputty/references
      - hooks
      - .claude/skills
    id: t-trails
    title: Convert the branch trails
    status: done
    brief: "End state: all 17 trails are YAML matching references/trail.md's four sections: core_objective as a | block, then decisions, not_yet_specified and out_of_scope as record lists. references/trail.md documents the YAML format instead of the markdown one. Verify require-grill.js's decision check still passes against a real converted trail: t-graph made it extension-aware, and this is where that is proven. Delete the markdown originals."
    contract: "In: docs.js trail feature-yaml-product-memory --section decisions --json. Out: the decision records, each with question, answer and link as separate fields. The trail set is sectioned and per-branch (t-sets-shape wired it into SETS), so it takes the branch as a positional argument and names the section."
  - deps:
      - t-trails
    scope:
      - skills
      - agents
      - hooks
      - "."
      - docs
      - .claude-plugin
      - README.md
      - .claude/skills
    id: t-readers
    title: Point every reader at the query instead of the file
    status: done
    brief: "End state: every instruction that told an agent to read a product doc tells it to query one. This is the half that makes the format pay: a YAML file nobody queries costs the same read the markdown did. 24 files name the docs; the dense ones are grill/SKILL.md (13 refs), spec.md (12), protocol.md (11), README.md (11), plan.md (9), audit/SKILL.md (7), agents/outputty-docs.md (7), master-qa (6). bootstrap writes YAML. The README goes through the documentation skill, never hand-edited. docs/flow.svg and skills/diagram/examples/flowchart.svg render the doc filenames as text, so redraw them via the diagram skill. ALSO REWRITE .claude-plugin/marketplace.json's DESCRIPTION TEXT (its format stays JSON — only the prose changes): today it claims 'No third-party dependencies', which is now false because tasks.js and docs.js require the bun runtime, and it describes product memory as 'four docs: product.md, roadmap.md, architecture.md, lessons.md', which this migration makes stale. That text is what a user reads before installing, so it shipping false is the worst kind of stale. The FORMAT of marketplace.json, hooks.json, settings.json, package.json and .oxlintrc.json is fixed by Claude Code, pnpm and oxlint — do not convert any of them to YAML. STOP and report if a reference cannot become a query because the reader genuinely needs the whole file."
    contract: "Mechanical sweep, checked by grep: rg -c 'product\\.md|roadmap\\.md|architecture\\.md|lessons\\.md|examples\\.md' skills agents hooks README.md returns no hits except a deliberate historical mention inside lessons.yaml."
    stage: sweep
  - deps: []
    scope:
      - skills/outputty
    id: t-sets-shape
    title: "Let docs.js query a sectioned set, not just a flat list"
    status: done
    brief: "End state: docs.js reads a set whose YAML is a MAPPING of sections, not only a flat list. Today loadRecords assumes a list and dies with a raw TypeError ('loadRecords(set).filter is not a function') on a mapping — verified live against a product-shaped fixture. That breaks product and architecture, which product-template.md itself defines as prose sections plus records, and it violates fail-loud: a TypeError is not a stated error. Shape: a mapping set is queried by section — 'docs.js product --section language --term Layer' returns that section's matching records; a prose section returns its text. A list-shaped set keeps working unchanged with no --section. A missing section, or an omitted --section on a mapping set, fails loud and names the sections that exist. This ALSO subsumes the 'trail' set QA deferred: a trail is four sections, so it needs no special case once sections work. Update product-template.md's shape table and add tests to docs.test.js."
    discovered_from: t-query
  - deps: []
    scope:
      - skills/outputty
      - .claude/skills
      - .claude-plugin
    id: t-graph-path
    title: "Resolve the task graph per feature, not per branch"
    status: done
    brief: "End state: tasks.js finds the ONE graph for the feature no matter which branch of the stack is checked out. Today taskFile() derives the path from the current branch, but BUILD publishes one branch per layer (feature/x-l1, -l2, ...), so standing on a layer branch silently creates a fresh EMPTY graph and the whole ledger vanishes. Verified live: on feature/yaml-product-memory-l1, 'tasks.js add' wrote a new feature-yaml-product-memory-l1.tasks.yaml holding one task while the real 7-task graph sat untouched beside it, and 'schedule' reported that single task as the entire plan. This is the same class as the slashed-branch bug t-graph already fixed: a derived path that silently resolves to nothing. Strip a trailing -l<N> layer suffix when resolving, and if the resolved graph does not exist while a sibling feature graph does, fail loud naming it rather than creating an empty one. Add a driver.mjs check so a layer branch cannot silently fork the ledger again."
    discovered_from: t-graph
  - deps: []
    scope:
      - .claude
    id: t-stale-example
    title: "Rewrite the task-line canonical example, which still shows JSONL"
    status: done
    brief: "End state: examples.yaml's 'A task line (the graph's unit)' shows the real current shape — a YAML block-style list item — instead of 'One JSON object per line' in a .tasks.jsonl file. t-graph changed the format and never updated the canonical example, and QA judged a partial fix (extension only) would leave the example self-contradictory, so it left the whole thing. This matters more than a normal stale line: examples.yaml is the library every agent is told to reuse VERBATIM, so a wrong canonical example propagates into every write-up, brief and PR body that cites it. Reuse the real record from .claude/trails/feature-yaml-product-memory.tasks.yaml as the input, and the real 'tasks.js schedule --json' output as the output — both are runnable now, so paste observed values, never invented ones. Check the other four examples in the file for the same rot while you are there."
    discovered_from: t-graph
  - deps: []
    scope:
      - .claude
    id: t-data-staleness
    title: Fix deleted-filename references inside the live product docs
    status: done
    brief: "End state: architecture.yaml (12 hits) and roadmap.yaml (2 hits) stop naming files this migration deleted. t-readers swept the INSTRUCTION surface (skills, agents, hooks, README, marketplace) to zero, but its contract never grepped .claude/ itself, so the data still describes the pre-migration world: architecture.yaml's discovery/brownfield/guards/memory_surfaces prose says 'findings feed product.md's roadmap' and names .claude/trails/<branch>.md and <branch>.tasks.jsonl; roadmap.yaml's 'Product memory' row names product.md + product-template.md. These are LIVE docs describing the present, so a deleted filename is simply wrong. DO NOT touch lessons.yaml: its 74 hits are historical entries that correctly record the filenames as they were at the time — rewriting history there would be the actual defect. Also reconcile two known content drifts while you are in architecture.yaml: memory_surfaces claims product.md has 'six canonical sections' when product.yaml has two, and roadmap.yaml's Product memory row undercounts the current five-surface-plus-claims split. Both predate this branch and were deferred to the merge distill; do them here instead, since you are editing the exact lines."
    discovered_from: t-readers
