# Task graph for feature/herdr-native-orchestration. Layers derived by tasks.js schedule.
- id: role-detection
  title: session.js detects orchestrator / item / plain and injects the matching protocol
  status: open
  deps: []
  scope: ["hooks"]
  brief: |
    End state: session.js resolves the session's role at SessionStart and injects by role.
    HERDR_ENV=1 and cwd a linked worktree -> item: inject protocol.md (the flow), as today.
    HERDR_ENV=1 and cwd the primary checkout -> orchestrator: inject orchestrator.md.
    No HERDR_ENV -> plain: inject protocol.md, as today. Subagent early-exit stays untouched.
    The worktree check is the spiked one: git rev-parse --git-dir vs --git-common-dir differ only in
    a linked worktree. Test-first in the repo's bun style with temp git repos for both shapes.
    Do NOT touch: the environment warnings session.js already emits (remote, gh) - they apply to
    every role.
  contract: |
    detectRole(cwd, env) -> "orchestrator" | "item" | "plain".
    Example: env HERDR_ENV=1, cwd a linked worktree (rev-parse --git-dir ".git/worktrees/x",
    --git-common-dir ".git") -> "item".
    Example: env HERDR_ENV=1, cwd primary (--git-dir ".git" equals --git-common-dir ".git")
    -> "orchestrator".
    Example: env without HERDR_ENV -> "plain".

- id: orchestrator-protocol
  title: hooks/orchestrator.md - the thin-main charter
  status: open
  deps: []
  scope: ["hooks"]
  brief: |
    End state: hooks/orchestrator.md carries the orchestrator protocol, migrated from the user's
    global CLAUDE.md and rewritten for the inversion. Contents: item dispatch (herdr worktree create
    --branch feature/<kebab> --base <default> --label "<item>" --no-focus; agent start <kebab-name>
    --kind claude; the brief = task pointer + entry point, nothing else - the child derives the rest
    from its own SessionStart); background watch (agent wait, never poll); gate alerts
    (herdr notification show naming the workspace label, never proxy the question); handover relay
    without re-verification; workspace close at merge; merge sequencing (one stack at a time);
    the write boundary (.claude/**, docs/**, README.md - planning and documentation only; audit and
    roadmap curation happen here); worktree-always, never split main's pane for an item, agent named
    after ongoing work, one item one workspace never reused. Checkable: every migrated rule from the
    ruling's table appears; "thinking happens here" and any main-session SPEC/PLAN/QA instruction
    appears nowhere.

- id: flow-protocol-updates
  title: The flow reads correctly from inside a child workspace
  status: open
  deps: [orchestrator-protocol]
  scope: ["hooks", "skills/outputty"]
  brief: |
    End state: protocol.md and the phase files assume the session may already sit on its item branch
    in a worktree. Step 1 becomes conditional: on an existing item branch (worktree), write the
    trail and open the draft PR; otherwise cut the branch first (plain role, unchanged). The merge
    step states the close-out: the handover is the last message, and the orchestrator closes the
    workspace - the child never closes its own. Gates state that the user answers directly in this
    session. Checkable: no flow instruction tells a child to create workspaces or dispatch sibling
    sessions; rg "worktree" in protocol.md hits the conditional step 1.

- id: write-boundary-hook
  title: Orchestrator write-boundary hook
  status: open
  deps: [role-detection]
  scope: ["hooks"]
  brief: |
    End state: a PreToolUse hook (Edit|Write|NotebookEdit matcher, wired in hooks.json) that, when
    the session role is orchestrator, denies edits outside .claude/**, docs/**, README.md with a
    message naming the boundary and pointing at item dispatch. Item and plain roles: silent exit.
    Role resolution shares the role-detection logic (a small shared hooks module is fine). Same
    synthetic-stdin bun test style as the other hooks.
    Do NOT touch: require-environment.js (the outside-a-repo guard is a different concern).
  contract: |
    stdin (hook JSON) -> stdout deny JSON, or exit 0 with no output.
    Example in (orchestrator role, cwd primary checkout, HERDR_ENV=1):
      {"tool_name":"Edit","tool_input":{"file_path":"skills/outputty/build.md"}}
    Example out:
      {"hookSpecificOutput":{"hookEventName":"PreToolUse","permissionDecision":"deny",
       "permissionDecisionReason":"The orchestrator edits planning and documentation only
       (.claude/**, docs/**, README.md). Code changes belong to an item workspace - dispatch one."}}
    Same input with file_path ".claude/roadmap.yaml" -> exit 0.
    Same input in a linked worktree (item role) -> exit 0.

- id: herdr-docs
  title: Documentation - README Herdr section, global-CLAUDE.md pointer snippet, product memory
  status: open
  deps: [role-detection, orchestrator-protocol, flow-protocol-updates, write-boundary-hook]
  scope: [".claude", "docs", "README.md"]
  brief: |
    End state, in one reviewable layer: README gains the Herdr-native usage section (the two roles,
    the item loop, HERDR_ENV requirement); docs/herdr-setup.md carries the paste-ready snippet that
    replaces the user's global CLAUDE.md herdr section with a pointer at the plugin;
    architecture.yaml's flow and what_it_stacks_on sections describe the orchestrator/child split;
    the roadmap row for this cycle closes per the roadmap-rework convention. Checkable: rg
    "thinking happens here" over the repo returns nothing; README names HERDR_ENV=1.
