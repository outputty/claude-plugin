core_objective: |
  Scoping trail for making bootstrap's scan depth user-selectable, with the expensive commit+diff scan
  gated behind an explicit checkbox.

  This trail predates the four-section shape — it originally carried only a "Thought-trail" list, whose
  last bullet named still-open follow-on work rather than a settled decision; that bullet is carried
  below as the sole `not_yet_specified` entry.

decisions:
  - question: init should let the user set scan depth.
    answer: |
      Step 2 now drives the **AskUserQuestion** tool (multi-select). Cheap sources (docs, docstrings)
      default on; the user confirms the set before any scanning runs.
    link: ""
  - question: Deep commit+diff scan is expensive → gate it behind a checkbox.
    answer: |
      New opt-in option "Deep commit + diff scan" (default OFF). Reading diffs/reverts recovers the
      historical pivots that commit messages rarely state — addresses the reverse-audit's
      scanner-genericization finding for history-heavy repos, without paying the cost by default.
      Dropped: reading diffs by default (kept messages-only as the cheap default).
    link: ""
  - question: scanner.md is now conditional.
    answer: |
      Messages/tags/merges by default; diffs/reverts only when the subagent is dispatched with "deep".
    link: ""
not_yet_specified:
  - "Still pending (from the reverse-audit, not in this change): STATED-vs-INFERRED output tagging,
    per-source size/sampling caps, and an explicit dedup/aggregation step."
out_of_scope: []
