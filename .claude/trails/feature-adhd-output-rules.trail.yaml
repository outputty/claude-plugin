# Trail — feature/adhd-output-rules
core_objective: |
  Embed the additive parts of ayghri/i-have-adhd (MIT) into hooks/protocol.md's "How to write"
  section, so every session gets action-first output shaping without installing the skill.
decisions:
  - question: "Which of the ten rules embed, and which stay out?"
    answer: >-
      Embedded: lead-with-action, numbered steps + five-item cap + concrete estimates, restate state
      across turns, one closing next action, tangent suppression, matter-of-fact errors + visible
      wins, no preamble/closers, the first-line/last-line pre-send check. Skipped as already
      enforced: brevity (Skeptical and concise), session-level drift-check (protocol has its own),
      the persistence block (protocol.md is re-injected every session start, so persistence is the
      mechanism, not an instruction), and the override list (the protocol's gates and escalation
      rules already own those cases).
    link: ""
  - question: "Conflict with response-format.md's restate-the-request spine?"
    answer: >-
      Reconciled in place: restating the problem is content, not preamble. Explanations restate
      first; actionable answers lead with the action. Stated in the embedded block's first bullet.
    link: ""
not_yet_specified: []
out_of_scope:
  - question: "Installing the skill itself, or its always-on flag-file hook — the protocol injection already covers reload."
    answer: ""
    link: ""
