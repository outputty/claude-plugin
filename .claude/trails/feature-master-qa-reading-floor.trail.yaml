# Planned-at: 0b95ce9
core_objective: |
  Master QA reads a build at its floor - three git calls and N whole-file Reads - held by mechanism,
  not prose: the orchestrator stops planting "query, never read whole" into QA briefs (a brief
  template in build.md), and a PreToolUse hook denies fragment reads of changed files for the
  master-qa agent. Simplifications ride along where the investigation exposed dead instruction
  surface.

decisions:
  - question: Root cause of master QA fragment-reading (68+ calls per run, 8-10 whole Reads)
    answer: |
      The orchestrator's freehand dispatch brief carries "query, never read whole" (verbatim in all
      three laygo QA briefs) plus a pin-point JUDGE checklist; the charter's whole-file rule loses to
      the brief. Dropped: the CLAUDE.md-conflict theory - project CLAUDE.md never reaches subagents
      (0 hits across the three QA transcripts), so the proposed laygo-side exemption fixes nothing.
    link: "auto-memory agent-frontmatter-effort-and-depth.md (transcript-verified 2026-08-13)"
  - question: Fix shape - mechanism over prose
    answer: |
      Three parts. (1) build.md step 2 gains a mandatory brief template - WHAT only; no reading
      instructions, the charter owns HOW. (2) A PreToolUse hook scoped to agent_type
      outputty:outputty-master-qa denies sed/head/tail/cat windows and rg/grep aimed at files in the
      changed set; the deny message restates the floor. (3) Whole-file Reads go out in parallel
      batches. Dropped: louder charter prose alone (already present twice, lost anyway).
    link: "agents/outputty-master-qa.md, skills/outputty/build.md:89"

  - question: Does the charter `skills:` preload deliver for plugin-namespaced agents
    answer: |
      YES - it works, and one frontmatter line was breaking it. CORRECTED 2026-08-14, superseding
      this trail's earlier "no" (the 2026-08-13 probe saw agent-protocol's text missing from a
      chartered scout and concluded the mechanism was dead; it had found a symptom, not the cause).
      Re-verified on CLI 2.1.231: a dispatch preloading four skills logs `Preloaded skill
      'documentation'` and `'qa'` against `Warning: Skill 'agent-protocol' ... was not found` plus
      the same for `code-rules` - and those two are the only skills in the plugin carrying
      `disable-model-invocation: true`. Strip the flag, re-probe, and the subagent quotes the file's
      text verbatim. So the fix is deleting one line per skill; the SubagentStart hook this trail
      previously specified would have replaced a working mechanism.
    link: "skills/agent-protocol/SKILL.md:4, skills/code-rules/SKILL.md"
  - question: Why the first probe got it wrong, and what stops a repeat
    answer: |
      The probe asked the subagent whether three marker strings were in its context and took "no" as
      proof the mechanism was dead. A skill that fails to resolve and a skill that resolves but is
      never injected produce identical answers, so the test could not tell them apart. The CLI
      already logs the difference. Standing rule now in the task brief and in auto-memory: verify a
      preload by dispatching with --debug and grepping for `Preloaded skill` / `was not found`,
      never by asking the agent what it can see.
    link: "auto-memory agent-frontmatter-effort-and-depth.md"

  - question: Hook posture on a caught fragment read
    answer: |
      Deny, with the floor restated in the message. Dropped - warn/injected nudge: prose at a new
      address; the plugin's own precedent (require-grill, require-master-qa) is that denial is the
      delivery that changes behavior. Denials scope to explicit changed-file targets so a false deny
      mid-gate stays near zero; directory-wide greps pass.
    link: "hooks/require-grill.js (the precedent shape)"
  - question: reading-changes.md
    answer: |
      Fold into the master-qa charter and delete the file. Its per-layer-QA half addresses a role
      deleted at 0.48.0, the charter is its sole reader (rg-verified), and folding moves the floor
      from a read-once reference into the always-loaded system prompt.
    link: "agents/outputty-master-qa.md"
  - question: Shared-rules delivery (the dead preload)
    answer: |
      Fix on this branch. A SubagentStart hook injects the agent-protocol text for outputty agent
      types; the dead `skills:` frontmatter lines are deleted from every charter. Dropped - defer to
      its own cycle: same failure class as the main fix, and the injection puts "Read it whole" into
      every agent's context from turn 1.
    link: "hooks/hooks.json, skills/agent-protocol/SKILL.md"
  - question: Stale product memory (pre-0.48 builder / per-layer QA doctrine)
    answer: |
      Fix on this branch, bounded to architecture.yaml's flow section and the one roadmap row; a
      wider product-docs audit stays out. Master QA judges builds against exactly these files.
    link: ".claude/architecture.yaml, .claude/roadmap.yaml"

  - question: Where documentation tasks land in a stack
    answer: |
      The last layer, always - user directive 2026-08-13. Code changes get reviewed first and on
      their own; the documentation is reviewed in full, in one place, not scattered through the
      stack. Encoded as a plan.md rule (docs-last-rule) and applied to this branch's own graph
      (product-memory-truth deps on every code task).
    link: ".claude/trails/feature-master-qa-reading-floor.tasks.yaml"

not_yet_specified:
  - The full fragment-command surface the hook must catch (awk windows, grep -A/-B context, git show
    HEAD:file pipes) - sharpens when the hook's contract is written at PLAN.

out_of_scope:
  - item: the Herdr-native restructure (main session orchestrates; whole flow runs in per-item child
      sessions; global-CLAUDE.md migration; session reset per work item)
    reason: a work item of its own with an open SPEC frontier; this branch's fixes hold under it
  - item: laygo repo edits (a CLAUDE.md exemption line for master QA)
    reason: verified not in the subagent channel; there is nothing to exempt
  - item: changing master QA's whole-file reading design itself
    reason: the design is right; its delivery failed

tasks:
  # Task graph for feature/master-qa-reading-floor. Layers derived by tasks.js schedule - never hand-authored.
  - id: reading-floor-hook
    title: Reading-floor hook denies fragment reads for master QA
    deps: []
    scope: ["hooks"]
    brief: |
      End state: a PreToolUse hook (Bash and Grep matchers, wired in hooks.json beside the existing
      entries) that acts ONLY when the hook input's agent_type is outputty:outputty-master-qa. It
      computes the build's changed set once per invocation (git diff --name-only against the
      origin-default merge-base, in the hook's cwd). A fragment read of a changed file - sed -n, head,
      tail, cat, awk-window, or rg/grep whose explicit target argument is a changed-set file - is
      denied with the floor restated. Everything else passes silently: directory-wide greps, files
      outside the set, the main session, every other agent. Test-first in the repo's own bun style
      (docs.test.js is the pattern): synthetic stdin fixtures in, deny JSON or silent exit out.
      Do NOT touch: block-dangerous-commands.js and require-master-qa.js (adjacent Bash-matcher hooks,
      out of scope). STOP and report if the PreToolUse input schema for subagent turns cannot carry
      agent_type per the installed CLI bundle - never ship a guessed schema.
    contract: |
      stdin (hook JSON) -> stdout deny JSON, or exit 0 with no output.
      Example in:
        {"agent_type":"outputty:outputty-master-qa","tool_name":"Bash",
         "tool_input":{"command":"sed -n '40,80p' skills/outputty/build.md"}}
        (skills/outputty/build.md is in the changed set)
      Example out:
        {"hookSpecificOutput":{"hookEventName":"PreToolUse","permissionDecision":"deny",
         "permissionDecisionReason":"skills/outputty/build.md is in this build's diff. Read it whole.
         The floor is three git calls and N whole-file Reads; grep and windows reach outside the
         changed set only."}}
      Same command without agent_type (main session) -> exit 0, no output.
      Grep tool, tool_input.path a changed file -> the same deny.

  - id: charter-reading-fold
    title: Fold reading-changes.md into the master-qa charter
    deps: []
    scope: ["agents", "skills/outputty/references"]
    brief: |
      End state: agents/outputty-master-qa.md carries the whole reading procedure - the three git
      calls, N whole-file Reads issued in parallel batches, the what-not-to-do table, and the rule
      that Grep/LSP reach outside the changed set only - and states the brief boundary in one line:
      the dispatch brief supplies WHAT to judge; this charter owns HOW to read, and a brief's reading
      instruction does not apply. skills/outputty/references/reading-changes.md is deleted; its
      per-layer-QA half dies with it (that reader was deleted at 0.48.0). Checkable: rg
      "reading-changes" over the repo returns nothing; the charter contains the three git commands,
      a parallel-batch line, and the what-not-to-do table.

  - id: brief-template
    title: Master QA dispatch-brief template in build.md
    deps: []
    scope: ["skills/outputty"]
    brief: |
      End state: build.md's "Master QA, once" step carries a fill-in brief template the orchestrator
      copies. Fields: the stack (branches, checkout path), the settled rulings and deferred scope,
      the real-run command with its expected counts, and the judge questions for this build. One
      explicit line: a brief carries no reading or context-sourcing instructions - the charter owns
      HOW the agent reads. Checkable: the step contains a fenced template; "query, never read whole"
      and any equivalent reading directive appear nowhere in it.

  - id: docs-last-rule
    title: Documentation tasks land in the stack's last layer (plan.md rule)
    deps: []
    scope: ["skills/outputty"]
    brief: |
      End state: plan.md's task-graph section states the rule - a task whose scope is documentation
      (README, docs/, .claude product-memory rewrites; not the flow's own instruction files, which are
      behavior) takes a dep on every code task it describes, so derivation places it in the stack's
      final layer, and the layer-size floor does not apply to that layer. Rationale stated in one
      line: the reviewer reads code changes first and the documentation in full, in one place.
      Checkable: plan.md states the rule; this branch's own graph demonstrates it
      (product-memory-truth is the last layer).

  - id: product-memory-truth
    title: Product memory drops pre-0.48 builder / per-layer-QA doctrine
    deps: [reading-floor-hook, charter-reading-fold, brief-template, agent-protocol-delivery]
    scope: [".claude"]
    brief: |
      End state: architecture.yaml's flow section describes the current shape - the session builds
      every layer itself, master QA is the only reviewer, the one real run happens there - and the
      "Hands-off BUILD" roadmap row's notes match build.md:3. Bounded: the flow section and that one
      row only; no wider docs audit. Checkable: rg "outputty-builder|outputty-qa" over
      .claude/architecture.yaml and .claude/roadmap.yaml returns no live-section hits (lessons.yaml
      and History remain archives and keep theirs).

  - id: agent-protocol-delivery
    title: Unbreak the charter skills preload by deleting one frontmatter line
    deps: []
    scope: ["skills/agent-protocol", "skills/code-rules"]
    brief: |
      End state: `disable-model-invocation: true` is deleted from skills/agent-protocol/SKILL.md and
      skills/code-rules/SKILL.md, so both preload into the charters whose `skills:` field names them.
      Nothing else changes: the `skills:` lines in the five charters STAY, no hook is written, and
      skills/agent-protocol/ is NOT deleted.

      Why this replaced the SubagentStart hook (2026-08-14): the preload was never dead. Re-verified
      live on CLI 2.1.231 - one dispatch preloading four skills logs `Preloaded skill 'documentation'`
      and `'qa'` against `Warning: Skill 'agent-protocol' ... was not found` and the same for
      `code-rules`; the ONLY property separating the groups is that flag. Removing it and re-probing,
      the subagent quotes the skill's text back verbatim. An earlier probe saw the missing text and
      wrongly concluded the mechanism was dead, which is why this task previously specified a hook to
      replace a mechanism that works.

      Verification is a run, not a read: dispatch a chartered agent with --debug and grep
      ~/.claude/debug/<session>.txt for "Preloaded skill 'agent-protocol'". A silent absence in the
      agent's context is indistinguishable from a broken mechanism, so do NOT verify this by reading.
      STOP and report if the warning persists after the line is removed.
    contract: |
      Dispatch a chartered outputty agent with --debug.
      Before: `[WARN] [Agent: <name>] Warning: Skill 'agent-protocol' specified in frontmatter was not found`
      After:  `[DEBUG] [Agent: <name>] Preloaded skill 'agent-protocol'`
      And the agent, asked whether its context contains "Need a file? `Read` it whole", answers yes.
