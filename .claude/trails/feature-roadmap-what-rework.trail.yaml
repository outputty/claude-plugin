# Trail — feature/roadmap-what-rework
core_objective: |
  Transfer the 2026-08-11 laygo roadmap-rework rulings (session 5fe38f11; laygo PR #184 is the
  approved implementation) into the plugin: roadmap = the WHAT (targets), product = the WHY,
  tasks = the HOW; every row a mini-spec summary; shipped rows close clean into roadmap/<name>.md
  writeups; plus the assume-little-context sharpening of response-format.
decisions:
  - question: "Roles: does this contradict yesterday's transfer?"
    answer: >-
      Yes, deliberately - the 2026-08-11 ruling supersedes the 2026-08-10 one that PR #88 encoded
      (roadmap was "why/vision"). New split: product = why, roadmap = what we're building
      (targets), architecture = what exists (coverage of the shipped surface), tasks = how.
      "Target" replaces "objective" as the pinned word; the branch-goal and trail
      `core_objective` senses of "objective" stay - different meaning, load-bearing field name.
    link: ""
  - question: "Row shape?"
    answer: >-
      Per laygo's merged contract: every row carries `summary` (problem statement + clear solution
      + e2e snippet with example inputs/outputs; real observed output on shipped rows, desired
      shape marked on open rows, problem-chased on killed rows). Shipped rows: one-line
      status_detail + doc: roadmap/<name>.md + absorbs: [former row numbers], no notes
      accumulation. Killed rows stay for the dedup pass. Writeup doc shape: capability paragraph,
      Before/After on the canonical example, The arc, Where the record lives.
    link: ""
  - question: "docs.test.js roadmap contract pins the OLD row fields against this repo's real file?"
    answer: >-
      Left green on purpose: this repo's own roadmap.yaml is not yet converted to the new shape
      (same standing follow-up as its architecture-index conversion), so the test still pins what
      the file actually is. The conversion task updates both together.
    link: ""
not_yet_specified:
  - question: >-
      Converting THIS repo's roadmap.yaml to mini-spec rows + roadmap/ writeups (and updating the
      docs.test.js roadmap-contract fields with it) - joins the standing architecture-index
