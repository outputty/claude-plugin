# The canonical worked examples, named — one per concept. Reused verbatim everywhere an example is
# shown; a new example is pinned here first.
- name: A task (the graph's unit)
  input: |
    What PLAN authors into the `tasks` MCP server with `add_task` — a real task from the
    yaml-product-memory feature:

    ```json
    {
      "project": "outputty",
      "id": "t-query",
      "title": "Define the YAML record shapes and build the docs query tool",
      "deps": [],
      "scope": ["skills/outputty"],
      "brief": "End state: references/product-template.md defines the YAML shape for each product-memory surface (product, roadmap, architecture, lessons, examples), and skills/outputty/docs.js answers a query against any of them without reading the file whole. Runs on bun for Bun.YAML.parse. Read-only: it never writes a doc.",
      "contract": "In: docs.js <set> [--<field> <value>] [--json]. Out: the matching records, JSON with --json, else one line per record.",
      "tier": 3,
      "qa": "subagent",
      "spec": "settled"
    }
    ```
  output: |
    The `tasks` MCP `schedule` tool derives the layers from the `deps` graph — real output, with
    `t-query` and its dependents already closed:

    ```json
    [
      [
        { "id": "t-lessons", "title": "Convert the 1494-line lessons chronology" },
        { "id": "t-stale-example", "title": "Rewrite the task-line canonical example" }
      ],
      [{ "id": "t-readers", "title": "Point every reader at the query instead of the file" }]
    ]
    ```
- name: A product-doc query (the lookup that replaces a whole-file read)
  input: |
    `docs.js` answers a question about a record set instead of returning the file. Run against the
    real `.claude/lessons.yaml` (165,449 bytes, 86 records):

    ```bash
    bun "${CLAUDE_PLUGIN_ROOT}/skills/outputty/docs.js" lessons \
      --files hooks/protocol.md --fields version,title --json
    ```
  output: |
    18 records, observed. `--files` filters; `--fields` projects, which is what makes it cheap —
    1,632 bytes against the file's 165,449. First two of the eighteen:

    ```json
    [
      { "version": "0.46.0", "title": "One response shape, for every substantive reply" },
      { "version": "0.45.0", "title": "The summary format becomes enforced" }
    ]
    ```
- name: A task trail entry (the decision log)
  input: |
    A settled question is recorded on its task in the `tasks` MCP server with `append_trail`:

    ```json
    {
      "id": "t-query",
      "kind": "decision",
      "text": "Records are YAML, one file per surface; docs.js reads with Bun.YAML and never writes."
    }
    ```
  output: |
    `get_trail` reads the task's thread back — the spec thought-trail, newest last:

    ```json
    [
      {
        "kind": "decision",
        "text": "Records are YAML, one file per surface; docs.js reads with Bun.YAML and never writes."
      }
    ]
    ```
- name: A layer of the build (what BUILD dispatches)
  input: |
    The orchestrator derives layers from the graph, then hands one layer to a builder.

    The `tasks` MCP `schedule` tool:

    ```json
    [
      [{ "id": "t-1", "title": "Drain the barrel re-exports", "scope": ["src/core"] }],
      [{ "id": "t-2", "title": "Point consumers at the modules", "scope": ["src/api"] }]
    ]
    ```
  output: |
    The layer write-up QA returns, and the PR body it becomes:

    ```json
    {
      "verdict": "passed",
      "checks": [{ "name": "implemented as briefed", "pass": true, "notes": "contract example is the test" }],
      "fixed": ["docstrings: 2 missing summaries → added"]
    }
    ```
- name: A product-doc load (what a session reads, and when)
  input: |
    The role a session is in:

    ```json
    { "phase": "BUILD", "task": "t-1", "question": "does this seam already exist?" }
    ```
  output: |
    The files that answer it — not the whole bundle:

    ```json
    { "load": ["product.yaml", "architecture.yaml"], "skip": ["roadmap.yaml", "lessons.yaml"] }
    ```
