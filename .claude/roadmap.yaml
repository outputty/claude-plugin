- row: 18
  feature: "Master QA reading floor (a hook a dispatch brief cannot override)"
  summary: |
    Problem: master QA's charter says to read each changed file whole, and across three real runs it
    did the opposite - 8-10 whole reads against 44-63 fragment fetches. The cause was not defiance.
    The orchestrator's freehand dispatch brief carried "query, never read whole" verbatim in 3 of 3
    runs, and a brief outranks a charter because it is the only user turn a subagent sees.
    Solution: stop the brief from carrying reading instructions (a WHAT-only template in `build.md`),
    and restate the floor at the moment it is crossed, where no brief can outrank it.

      # a windowed read of a file that is in the diff, by outputty:outputty-master-qa
      echo '{"agent_type":"outputty:outputty-master-qa","cwd":"'"$PWD"'","tool_name":"Read",
      "tool_input":{"file_path":"hooks/session.js","offset":100,"limit":20}}' | node hooks/reading-floor.js

    Output (REAL OBSERVED): `{"hookSpecificOutput":{"hookEventName":"PreToolUse","permissionDecision":
    "deny","permissionDecisionReason":"`hooks/session.js` is in this build's diff, and this Read is
    windowed (offset/limit). Read it whole. The floor for this review is three git calls and N
    whole-file Reads, one per changed file. …"}}` — the reason then restates the whole floor verbatim
    from `hooks/reading-floor.js`.
  status: "✅ shipped"
  status_detail: "0.53.0 — `hooks/reading-floor.js`, scoped to `outputty:outputty-master-qa`; a grep outside the changed set is never denied."
  depends_on: [Hands-off BUILD]
  links: [".claude/trails/feature-master-qa-reading-floor.trail.yaml"]
- row: 19
  feature: "Herdr-native orchestration (thin main session; whole flow + gates in per-item child workspaces)"
  summary: |
    Problem: the orchestration rules lived in a global CLAUDE.md that never reaches a plugin consumer,
    and they split the work the wrong way - thinking on main, doing in the child - so main ran SPEC and
    PLAN for an item it would never build. Solution: one thin orchestrator per repo in the primary
    checkout; every work item gets its own worktree-backed workspace where the whole flow runs, gates
    included, with the user answering them there. The role is detected mechanically, with no new flag.

      $ HERDR_ENV=1 node hooks/session.js < /dev/null   # in the primary checkout

    Output (REAL OBSERVED): the first line is `# OUTPUTTY — orchestrator session (Herdr)`, followed by
    the shared rules only. The flow half of `protocol.md` is not injected.
  status: "✅ shipped"
  status_detail: "0.53.0 — `hooks/lib.js` `detectRole`, `hooks/orchestrator.md`, and `hooks/write-boundary.js`, which denies an orchestrator edit outside `.claude/**` (except trails), `docs/**` and `README.md`."
  depends_on: [Flow spine]
  links: [".claude/trails/feature-herdr-native-orchestration.trail.yaml"]
- row: 20
  feature: "The bare-minimum cut (delete what no measurement defends)"
  summary: |
    Problem: the plugin carried a reference library nothing opened. Of 1,902 lines the audit marked for
    deletion, 1,437 (76%) sat in files with a lifetime read count of 0 or 1, two shipped gates were
    defeated by construction, and nine rules contradicted each other across files - including two
    published `docs.js` commands that returned nothing. Solution: delete the unread files, fold each
    survivor's one live paragraph into the file that already reaches a reader, and name a winner for
    every conflict.

      $ git ls-files 'hooks/*' 'skills/**' 'agents/*' | wc -l

    Output (REAL OBSERVED): 49 at 0.51.0, 37 at 0.53.0. Every deleted rule was either folded into a
    surface that already reaches a reader (the injected protocol, a preloaded skill, a charter) or
    dropped with its measurement recorded.
  status: "✅ shipped"
  status_detail: "0.52.0-0.53.0 — 19 files deleted, 12 merges folded, 9 conflicts resolved, and every human-facing and agent-facing doc rewritten against what actually ships."
  depends_on: []
  links: []
