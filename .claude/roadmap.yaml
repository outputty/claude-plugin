# One row per target. Live rows link their plan (`trails/<branch>.trail.yaml`); shipped rows their PR.
# The story lives in PRs and `lessons.yaml` — never here.
#
# `row` is the row's identity: it is what an orchestrator brief names, and what an `absorbs:` entry
# greps back to. Rows 1-17 predate the mini-spec `summary` convention and still carry `notes`; every
# row added from row 18 on carries the full shape (see references/product-template.md). Converting the
# older rows is tracked work, not a licence to add another `notes`-only row.
#
# Where things stand: 0.54.0. The flow now runs as TWO STAGES joined only by the task queue - planning
# (SPEC + PLAN, synchronous, gated) and building (BUILD + master QA + merge, asynchronous, unattended),
# with `spec: replan` as the iteration between them. The discovery front-end, product memory, and the
# guard layer are shipped. 0.48.0 collapsed BUILD onto the session itself; 0.52.0-0.53.0 cut the
# instruction set to what a measurement could defend and made the flow Herdr-native; 0.54.0 (row 23)
# deleted every hook, moving the flow to skills and a managed CLAUDE.md block init writes.
