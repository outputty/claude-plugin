- row: 18
  feature: "Master QA reads whole files (a discipline a dispatch brief cannot override)"
  summary: |
    Problem: master QA's charter says to read each changed file whole, and across three real runs it
    did the opposite - 8-10 whole reads against 44-63 fragment fetches. The cause was not defiance.
    The orchestrator's freehand dispatch brief carried "query, never read whole" verbatim in 3 of 3
    runs, and a brief outranks a charter because it is the only user turn a subagent sees.
    Solution, two parts: stop the brief from carrying reading instructions (a WHAT-only dispatch
    template in the build stage), and state the whole-file floor in the master-QA charter so it holds
    without a brief. The floor was a `reading-floor.js` hook at 0.53.0; when 0.54.0 removed all hooks
    (row 23) it became a charter rule, since a plugin cannot ship a hook-free deterministic deny.
  status: "✅ shipped"
  status_detail: "0.54.0 — a rule in the `outputty-master-qa` charter (was `hooks/reading-floor.js` at 0.53.0). The driver still pins the reviewer's committed-range git usage."
  depends_on: [Hands-off BUILD]
  links: [".claude/trails/feature-master-qa-reading-floor.trail.yaml"]
- row: 19
  feature: "Herdr-native orchestration (thin main session; each item and its gates in its own child workspace)"
  summary: |
    Problem: the orchestration rules lived in a global CLAUDE.md that never reaches a plugin consumer,
    and they split the work the wrong way - thinking on main, doing in the child - so main ran SPEC and
    PLAN for an item it would never build. Solution: one thin orchestrator per repo in the primary
    checkout; every work item gets its own worktree-backed workspace where its stage runs, gates
    included, with the user answering them there. The role is detected mechanically, with no new flag.

      $ HERDR_ENV=1 node hooks/session.js < /dev/null   # in the primary checkout

    Output (REAL OBSERVED): the first line is `# OUTPUTTY — orchestrator session (Herdr)`, followed by
    the shared rules only. Neither stage file is injected, so a grep for the two stage headings
    returns 0.
  status: "✅ shipped"
  status_detail: "0.53.0 — role detection via `hooks/lib.js`, the orchestrator charter, and a `write-boundary.js` deny. 0.54.0 (row 23) moved the charter and the write boundary into the CLAUDE.md block and dropped the hook; the role is now the checkout, stated in the block."
  depends_on: [Flow spine]
  links: [".claude/trails/feature-herdr-native-orchestration.trail.yaml"]
- row: 20
  feature: "The bare-minimum cut (delete what no measurement defends)"
  summary: |
    Problem: the plugin carried a reference library nothing opened. Of 1,902 lines the audit marked for
    deletion, 1,437 (76%) sat in files with a lifetime read count of 0 or 1, two shipped gates were
    defeated by construction, and nine rules contradicted each other across files - including two
    published `docs.js` commands that returned nothing. Solution: delete the unread files, fold each
    survivor's one live paragraph into the file that already reaches a reader, and name a winner for
    every conflict.

      $ git ls-files 'hooks/*' 'skills/**' 'agents/*' | wc -l

    Output (REAL OBSERVED): 49 at 0.51.0, 37 at 0.53.0. Every deleted rule was either folded into a
    surface that already reaches a reader (the injected protocol, a preloaded skill, a charter) or
    dropped with its measurement recorded.
  status: "✅ shipped"
  status_detail: "0.52.0-0.53.0 — 19 files deleted, 12 merges folded, 9 conflicts resolved, and every human-facing and agent-facing doc rewritten against what actually ships."
  depends_on: []
  links: []
- row: 21
  feature: "Two-stage flow (planning synchronous and gated; building asynchronous on a sweep; the task queue between them)"
  summary: |
    Problem: one session carried the whole cycle, so the human-gated half and the unattended half were
    welded together. No build could start until a human had sat through SPEC and PLAN in that same
    session, and a build that then hit unclear requirements had two exits, both bad: guess, or stall in
    a pane nobody is watching.
    Solution: two stages joined only by the task queue. Planning is synchronous, gated, one item at a
    time, and it ends at `spec: settled` plus a `tier`. Building is asynchronous and starts from a
    sweep over `tasks.js ready`. A build that hits a requirements gap scratches that work, appends an
    `attempts` entry, sets `spec: replan`, and stops; the item re-enters planning carrying the
    evidence. Each session is TOLD its stage and `hooks/session.js` injects only that stage's file.

      $ echo build > .claude/stage
      $ node hooks/session.js < /dev/null | head -1
      $ node hooks/session.js < /dev/null | grep -c 'PLANNING stage'

    Output (REAL OBSERVED): `# OUTPUTTY - BUILD stage`, then `0`. The planning stage file is not
    injected. With neither `OUTPUTTY_STAGE` nor `.claude/stage` set, both files inject and one session
    runs everything.
  status: "✅ shipped"
  status_detail: "0.54.0 - the two stages are `skills/planning` + `skills/build` (row 23 made them skills, replacing the injected stage files); `spec` and `tier` on the task; `tasks.js ready`/`planning`/`index`."
  depends_on: [Flow spine, Task graph, Herdr-native orchestration]
  links: []
- row: 22
  feature: "Task graph in the trail, task state one file per task"
  summary: |
    Problem: a branch carried two files, `<branch>.trail.yaml` and `<branch>.tasks.yaml`, and the
    tooling rewrote the second one whole. `Bun.YAML.stringify` flattens every `|` block scalar into one
    escaped line, so any tool write destroyed hand-authored prose. Structure and state also shared one
    writer, so two sessions on one branch conflicted over a task's status.
    Solution: structure is hand-authored in the trail's `tasks:` section and never tool-written. Mutable
    state (`status`, `spec`, `tier`, `attempts`) goes to `.claude/tasks/<id>.yaml`, one file per task.
    `tasks.js index` derives `.claude/tasks.yaml` from the two halves joined field by field.

      $ md5 -q .claude/trails/feature-csv-export.trail.yaml
      $ bun "${CLAUDE_PLUGIN_ROOT}/skills/outputty/tasks.js" close schema
      $ md5 -q .claude/trails/feature-csv-export.trail.yaml

    Output (REAL OBSERVED): `6d8484de2b94a352fe5b889a079ea0a1` before and after, byte-identical. The
    write landed in `.claude/tasks/schema.yaml`, which now reads `id: schema` / `spec: settled` /
    `status: done`.
  status: "✅ shipped"
  status_detail: "0.54.0 - the `tasks:` section in the trail, `.claude/tasks/<id>.yaml` per task, and the derived `.claude/tasks.yaml` index. Every `<branch>.tasks.yaml` was folded into its trail."
  depends_on: [Task graph, Product memory]
  links: []
- row: 23
  feature: "Skills-only conversion (delete every hook; init writes the CLAUDE.md block + permissions)"
  summary: |
    Problem: the plugin leaned on hooks - a SessionStart hook injected 30-38KB into every session, and
    six PreToolUse hooks denied tool calls. Injection was wasteful and the deny-hooks fought the
    platform: the permission classifier blocked edits to the guard scripts, and an audit found two
    gates passable by accident. Solution: delete all hooks and rebuild on skills + declarative config.
    The two stages become skills the orchestrator invokes (`/outputty:planning`, `/outputty:build`);
    the always-on rules (orchestration charter, product-memory query catalogue, writing standard) move
    into a managed CLAUDE.md block that a run-once `/outputty:init` writes; enforcement becomes
    `permissions` init writes into `.claude/settings.json`. There is no orchestrate skill - the main
    session orchestrates from the block alone. Per-session always-on load dropped from ~4,000 words to
    ~1,073 (the block), with stage content now loaded only on demand.
  status: "✅ shipped"
  status_detail: "0.54.0 - `hooks/` is gone; `skills/planning`, `skills/build`, `skills/init` and `skills/init/block.md` carry the flow; `docs/security.md` documents the permissions."
  depends_on: [Two-stage flow, Herdr-native orchestration]
  links: [".claude/trails/feature-skills-only-conversion.trail.yaml"]
- row: 24
  feature: "QA gradation + full-diff review (skip / inline / subagent, set at PLAN)"
  summary: |
    Problem: every build ran the full independent master-QA subagent, even a one-line removal — and the
    reviewer read every changed file whole on top of the full diff, doubling the read. Solution: a `qa`
    task field (`skip` | `inline` | `subagent`, default `subagent`) set at PLAN, never by the build, so
    a session cannot downgrade its own review; a build's level is the strongest `qa` among its drained
    tasks. `subagent` is the independent pass, `inline` a self-review in the build session, `skip` is
    CHECKS-green. Master QA now judges the full `git diff` as its primary read and reads a file whole
    only when a finding needs the surrounding code. The build also reads its test watcher instead of
    re-running the whole suite each layer.
  status: "✅ shipped"
  status_detail: "0.55.0 - `qa` on the task (tasks.js validates + surfaces it), the review branch in skills/build, and the full-diff-first rule in the outputty-master-qa charter."
  depends_on: [Hands-off BUILD, Two-stage flow]
  links: []
- row: 25
  feature: "Generic read-only reviewer + skills at dispatch (agents carry no domain logic)"
  summary: |
    Problem: each read-only subagent job was a bespoke agent, and the qa gradation's `inline` level had
    to read the master-QA agent charter as a lens list — awkward, and the review logic lived in a place
    a session couldn't cleanly reuse. Solution: one generic read-only executor, `outputty-reviewer`,
    that carries no domain logic; the dispatch names a skill to load and sets the model. The whole-build
    review became the `qa` skill, run on the reviewer at opus/xhigh for `subagent` and loaded in the
    build session for `inline` — one home for the logic, two contexts. `outputty-master-qa` was deleted.
    Kept bespoke: `outputty-expert` (it writes a knowledgebase, so it is not read-only). References
    (merge-step, spike) stay references, not skills — a reference costs nothing until read, a skill
    costs its description always.
  status: "✅ shipped"
  status_detail: "0.56.0 - `agents/outputty-reviewer.md` (generic read-only) + `skills/qa/SKILL.md`; the build skill's qa gradation dispatches the reviewer with the qa skill or loads it inline."
  depends_on: [QA gradation]
  links: []
