statement: |
  TaskCreate/TaskGet/TaskList/TaskUpdate/TaskOutput are withheld from subagents (a subagent reports none
  of them); TodoWrite is NOT stripped. AskUserQuestion is stripped from every subagent even when its
  charter lists it. Basis for inline task lists in briefs and HITL resolution before dispatch.
