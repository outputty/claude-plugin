# The target surface, then its machinery — one place per concept. Mermaid, never SVG.
target_program: |
  The finished surface - what a user actually types and gets back, end to end (informed by the North
  Star; this is the concrete experience, not the goal statement). Two stages, joined by the task queue.

  ```text
  PLANNING SESSION  ── synchronous, one item, you are in the loop
  > outputty: add CSV export to the report page

  SPEC   · one question at a time (business, then technical); you approve the spec.
           First artifact: the "What we're building towards" program for the feature.
  PLAN   · task graph written; derived layers previewed with contracts; you approve.
  SETTLE · `spec: settled` + `tier` on the task. The planning session stops here.

  BUILD SESSION  ── asynchronous, unattended, started by a sweep over `tasks.js ready`
  BUILD  · this session builds every layer itself, test-first, and ships each layer
           as its own stacked draft PR.
  QA     · one read-only master QA over the whole stack, once the graph drains.
           The build's only real run of the target program.
  MERGE  · product memory distilled, version bumped, stack merged atomically.
  ```

  One item of intent in, one merged stack out. The PRs narrate themselves well enough that reviewing
  them requires no session context. A build that hits a requirements gap sets `spec: replan` instead,
  and the item re-enters planning carrying its `attempts`.

shape: |
  **Shape.** A Claude Code plugin with a single-plugin marketplace (`source: "./"`, one
  `marketplace.json` in `.claude-plugin/` carrying the plugin entry).

what_it_stacks_on: |
  **What it stacks on - the platform, and nothing else:**
  - **Code intelligence (LSP)** - go-to-definition, find-references, and automatic diagnostics after each
    edit, via Claude Code's own language-server plugins. **Recommended, never required**: it covers 11
    languages, and `Grep`/`Glob` remain the floor for everything else.
  - **Claude Code auto-memory** - durable lessons across sessions. Written at the merge retrospective and
    when the user corrects the agent; recalled by the platform's own `MEMORY.md` index, which every
    session loads. **outputty ships no recall mechanism of its own.**
  - **`gh` + `gh stack`** - the draft PR at branch cut, one stacked PR per layer, and the atomic
    `gh stack merge --yes`. A hard requirement, with no single-PR fallback.
  - **Herdr** *(optional)* - the terminal multiplexer that supplies `HERDR_ENV=1`, worktree-backed
    workspaces, and the pane layout. Its presence changes **who starts a session**, never what a stage
    is. Without it you start each stage's session yourself, unchanged.
  - **outputty** - the two stages and the queue that joins them (planning: SPEC + PLAN; build: BUILD +
    master QA + merge), product memory (this file), and the laziest-working-diff build discipline. The
    discipline is owned in-plugin as `skills/code-rules/SKILL.md` and injected by `hooks/session.js` at
    every session start.

flow: |
  **Flow.** Two stages, joined only by the task queue. **Planning is synchronous** and human-gated.
  **Building is asynchronous** and unattended. Neither waits on the other. A task's `spec` field says
  which stage owns it, and `tasks.js ready` / `tasks.js planning` are the two disjoint queues over the
  same graph.

  `hooks/session.js` injects one stage file per session, `hooks/stage-planning.md` or
  `hooks/stage-build.md`, plus `hooks/shared.md` and the code rules. Each stage file carries its whole
  stage inline. There is no entry skill and there are no phase files: the injected stage is the entry
  point.

  **The stage is told, never guessed.** `OUTPUTTY_STAGE` wins. Otherwise `.claude/stage` holds one word,
  `planning` or `build`, written into the checkout before the session starts. With neither set, both
  stage files inject and one session runs everything. A `.claude/stage` holding any other word warns on
  stdout and falls back to both.

  **PLANNING - gated, one item.** Step 1 is the branch and the draft PR, conditional: on an item branch
  in a worktree the branch is already cut, so the session writes the trail and opens the PR. **SPEC**
  grills business goals then technical goals as two distinct passes, drafts the **target program** as
  its first artifact, and writes one trail record per settled question before asking the next. Its
  **spike** step answers an *empirical* question rather than an arguable one, and a spike is **a test in
  the repo's own suite** named `spike-<slug>`: variants are cases in one file, it is committed to the
  branch as written, and it either graduates into the standing re-verification probe for a routed fact
  or is deleted in the same session. **PLAN** writes a **task graph**, the `tasks:` section in the
  branch trail holding tasks with `deps` and `scope`, and `tasks.js schedule` **derives** the layers
  from it. No layer is hand-authored, and a dependency cycle fails loud. For a large or uncertain
  deliverable PLAN may **stage** the work: a `deps` chain over one scope tagged
  `prototype → build → sweep`. That `stage` is a label that rides the schedule preview and the PR
  comment; ordering is still the `deps`. A design fork PLAN cannot settle goes back to SPEC as a spike
  per candidate. The stage ends at `spec: settled` plus the task's `tier`, and nothing else counts as
  finishing it.

  **The gates stop for the user, in the planning session itself.** Under Herdr the orchestrator raises
  a notification naming the workspace and stays out of it. A gate is never relayed or proxied.

  **BUILD has no agents. One session builds every layer itself.** There is no build agent and no
  per-layer QA. **The repo's own `CHECKS` is BUILD's early warning, not a reviewer.**

  Per layer, in order: re-check the task against the roadmap and the trail (still right / stale words /
  already done / no longer serves the roadmap → escalate), resolve any `mode: hitl` task with the user,
  turn each task's `contract` into a failing test, write the laziest diff to green, run `CHECKS` for
  real and watch the red→green transition, then cut `feature/<x>-l<N>` off the layer below **before**
  committing and publish it with `gh stack`. A cumulative recap prints after every layer.

  **A requirements gap is a replan, not a question.** A build that cannot proceed without a ruling
  nobody has made scratches the work it built on the gap, appends an `attempts` entry (`tried` and
  `killed_by` both required, with a file:line or a run as evidence), sets `spec: replan`, and stops. The
  task leaves the build queue and the planning stage picks it up, reading `attempts` before it asks
  anything. **Escalation is reserved for a blocker planning cannot answer**: a broken environment, a
  missing credential, a dependency that does not exist. Nothing merges on an escalation.

  **Master QA runs once, after the graph drains, and it is the only review.**
  `outputty:outputty-master-qa` is chartered read-only at Opus. It performs the build's **one real run**
  of the target program, judges the whole diff against product memory's **North Star, roadmap and
  Architecture** rather than code craft, and writes **the handover**: what happened, which roadmap row
  moved, and whether this work still belongs in the project. Its verdict is `pass` (merge step),
  `fail`-salvage (`tasks.js add`, build another layer, run it again), or `fail`-rewrite (escalate). **A
  rewrite is escalated, never attempted**: it needs new requirements, and requirements are gated.
  **Nothing mechanically blocks a merge that skipped master QA**, and the merge step assumes its
  verdict.

  **The brief a master-QA dispatch carries says WHAT to judge and nothing about HOW to read.** Its
  charter owns the reading discipline: whole files, in parallel batches, three git calls first.
  `hooks/reading-floor.js` denies a fragment read of a file that is in the diff, and no brief can
  outrank it.

  **Under Herdr the stages do not change; who starts a session does.** `hooks/lib.js` `detectRole`
  resolves the role with no new flag: `HERDR_ENV` unset is `plain`; `HERDR_ENV=1` with
  `git rev-parse --git-dir` equal to `--git-common-dir` is the `orchestrator` in the primary checkout;
  `HERDR_ENV=1` in a linked worktree is an `item`. An orchestrator gets `hooks/orchestrator.md` plus the
  shared rules. It writes `.claude/stage`, dispatches with the flags `tasks.js dispatch` prints, and
  relays the child's verdict. It never runs a stage, never re-verifies a child's QA, and never answers a
  gate. An item and a plain session both get a stage file. A subagent gets nothing: its charter preloads
  the same rules through `skills:`.

  Two platform constraints the agent design rests on: subagents get no
  TaskCreate/TaskGet/TaskList/TaskUpdate/TaskOutput and no AskUserQuestion even when chartered
  (TodoWrite survives). A brief therefore carries its task list inline, and every human question
  resolves before dispatch. Re-run the enumeration after a Claude Code major version bump.

  The two stages at a glance (Mermaid, inline - product memory is agent-consumed, so diagrams here are
  text, never SVG, and never a separate `.mmd` file):

  ```mermaid
  flowchart TD
    subgraph PLANNING [PLANNING · synchronous · human in the loop]
      B[Branch + draft PR<br/>states the objective] --> S[SPEC · gated<br/>target program first]
      S -.->|question is empirical| K[/spike · a spike-slug test<br/>in the repo's own suite/]
      K -.->|answer redrafts target program| S
      S --> P[PLAN · gated<br/>graph → derived layers]
      P --> T[spec: settled + tier<br/>the handoff]
    end
    T ==> Q[(task queue<br/>tasks.js ready)]
    subgraph BUILD [BUILD · asynchronous · runs on a sweep]
      Q ==> L[Layer loop · one session builds it<br/>test-first → CHECKS → gh stack]
      L -->|next layer| L
      L --> M[Master QA · once · read-only<br/>the build's one real run]
      M -->|pass| G[Merge step · distill, bump, gh stack merge]
      M -->|fail · salvage| L
      M -->|fail · rewrite| E[Escalate to the user]
    end
    L -.->|requirements gap| R[spec: replan<br/>+ an attempts entry]
    R -.->|planning picks it up| S
  ```

protocols:
  # The seams between the stages and their parts. Per seam: the parent supplies inputs, the child
  # returns outputs; the child knows nothing about its parent. PLAN derives task `contract`s from these
  # (a new seam is a SPEC-gate edit, never invented silently mid-build).
  - protocol: "session.js -> session"
    from: session.js
    to: session
    in: >-
      the hook payload, `HERDR_ENV`, the checkout's git dirs, and the declared stage (`OUTPUTTY_STAGE`,
      else `.claude/stage`)
    out: >-
      one injected document set, chosen by role then stage - `orchestrator.md` + `shared.md` for an
      orchestrator; one stage file (or both, when no stage is declared) + `shared.md` +
      `code-rules/SKILL.md` for an item or a plain session; nothing for a subagent
  - protocol: "PLANNING -> the task queue"
    from: PLANNING stage
    to: ".claude/tasks/<id>.yaml"
    in: "a settled item: its trail, its target program, and its `tasks:` graph"
    out: "`spec: settled` plus the task's `tier`; this is the whole handoff, and no session is briefed"
  - protocol: "the task queue -> BUILD"
    from: tasks.js
    to: BUILD stage
    in: "a sweep over the graph"
    out: >-
      `ready` (open, `spec: settled`, every dep done) and its disjoint mirror `planning`
      (`drafting`/`replan`); an empty `ready` is a sleep, never a problem
  - protocol: "BUILD -> PLANNING (replan)"
    from: BUILD stage
    to: ".claude/tasks/<id>.yaml"
    in: "a requirements gap no ruling covers, after the work built on it is scratched"
    out: "`spec: replan` plus an `attempts` entry; `tried` and `killed_by` are both required"
  - protocol: "tasks.js -> task state"
    from: tasks.js
    to: ".claude/tasks/<id>.yaml"
    in: "a close/add/amend, and the joined task it applies to"
    out: "one rewritten state file; the hand-authored trail is never opened for writing"
  - protocol: "PLAN -> tasks.js"
    from: PLAN
    to: tasks.js
    in: "the trail's `tasks:` section, joined with `.claude/tasks/<id>.yaml` state"
    out: "`schedule --json` layers (a cycle = loud failure)"
  - protocol: "BUILD -> master QA"
    from: BUILD
    to: outputty-master-qa
    in: >-
      the branch stack and its PR numbers, the trail's SETTLED rulings, what was DEFERRED, the exact
      command for THE REAL RUN with its expected output, and the numbered questions to JUDGE — never a
      reading instruction
    out: "`pass` | `fail` · salvage | `fail` · rewrite, plus the handover"
  - protocol: "orchestrator -> item workspace"
    from: orchestrator
    to: item session
    in: >-
      a fresh worktree-backed workspace, `.claude/stage` written before the agent starts, the
      `--model`/`--effort` flags `tasks.js dispatch <id>` prints, and a two-line brief naming the
      roadmap row or task id and the cut branch - never a stage, never a reading instruction
    out: the child's own handover and its master-QA verdict, relayed rather than re-derived
  - protocol: "stage -> gh"
    from: a stage session
    to: gh
    in: branch
    out: "draft PR, one stacked PR per layer, `gh stack merge --yes`"

memory_surfaces:
  # The anti-double-log line: each memory surface owns one kind of content — decisions live across
  # product.yaml/roadmap.yaml/architecture.yaml/tasks.yaml/lessons.yaml/examples.yaml, never duplicated
  # between them.
  - path: .claude/product.yaml
    holds: >-
      **north_star** (mission + principles) and **language** (the project glossary) — the two sections
      every session must read. Targets live in `roadmap.yaml`, the coverage index + topic files in
      `architecture.yaml`/`architecture/*.md`, the durable task index in `tasks.yaml`, and chronology in
      `lessons.yaml` (`examples.yaml` holds the canonical worked examples; an external fact is routed to
      where its reader works — there is no ledger), per
      `skills/outputty/references/product-template.md`. Decisions live across these surfaces **only**.
    lifecycle: >-
      The SessionStart protocol tells the agent to read it at session start (or `bootstrap` reconstructs
      it if absent).
  - path: ".claude/trails/<branch>.trail.yaml"
    holds: >-
      the per-branch **spec thought-trail**, plus the task graph in its `tasks:` section. It is
      hand-authored: `tasks.js` reads it and writes progress to `.claude/tasks/<id>.yaml` instead.
    lifecycle: >-
      distilled into product memory at merge, then cold archive. Under Herdr it belongs to the item
      session that grilled it: `hooks/write-boundary.js` denies the orchestrator any write to
      `.claude/trails/**`, because authoring one on main rebuilds SPEC-and-PLAN-on-main.
  - path: ".claude/experts/<slug>.md (+ <slug>/ source cache)"
    holds: >-
      per-lens expert **knowledgebase** for advanced grilling: footnoted, date-stamped findings an
      `outputty-expert` re-validates on load (disproven priors kept with *why*, never deleted) and
      refreshes each run, each grounded in the **nearest-to-source** evidence (installed source code +
      official docs over blogs), with every fetched source cached alongside so a footnote outlives its
      URL.
    lifecycle: >-
      Committed (shared, improves across sessions); read at panel-composition to reuse experts before
      inventing.
  - path: "~/.claude/projects/<repo>/memory/"
    holds: >-
      Claude Code **native auto-memory** (v2.1.59+, agent-writable): topic files load on demand via a
      `MEMORY.md` index. The home for a durable lesson the surfaces above do not own — a process lesson,
      a chat-only gotcha or preference, a doc worth re-reading. **Never decisions.** Machine-local, not
      committed.
    lifecycle: >-
      The `MEMORY.md` index is itself injected at every session start, and it is the whole recall
      mechanism — keep it bounded, replace-don't-append, and let a memory earn its place by its index
      line. **outputty ships no recall mechanism of its own.** The merge step's **retrospective**
      (`hooks/stage-build.md`, run before the PR finalizes, and on escalated cycles too) routes lessons
      here and mints a skill *only* for a proven reusable procedure, by invoking the installed
      `anthropic-skills:skill-creator`.

branch_model_github: |
  **Branch model + GitHub (prescribed).** One feature branch carries the whole cycle. A **draft PR opens
  at branch cut**, before any work, its body stating the core objective, so scoping (trail + product
  memory diff) and code are reviewed together — and that PR is the **bottom of a stack**. BUILD ships
  **one PR per layer** on top of it and lands the whole stack **atomically** (`gh stack merge --yes`),
  so one unmergeable layer merges none and a half-built feature never reaches the default branch.
  **`gh stack` is a hard requirement** alongside `gh`; there is no single-PR fallback.

  **The layer branch is cut BEFORE the commit** (`feature/<x>-l<N>`, off the previous layer's branch,
  never off main) — a commit made on the branch below lands in the wrong PR. Layers are named with a
  **hyphen, never a slash**: `feature/<x>/l1` is rejected by git the moment `feature/<x>` exists,
  because a ref cannot also be a directory. Two `gh stack` flags are load-bearing and both are hands-off
  traps: `gh stack init` with no arguments demands interactive input, and `gh stack submit` opens an
  editor unless you pass `--auto` (with `--auto`, new PRs are created as drafts, which is what BUILD
  wants — nothing is ready until master QA). `--auto` also names each PR after its branch, so the title
  is set explicitly from the write-up's own heading. A rebase conflict between layers is an
  **escalation**, never force-resolved inside a hands-off build.

  **Every PR write — draft body, per-layer write-up, final description — follows one canonical spec**
  (`skills/outputty/references/pr-description.md`, named by `hooks/shared.md` and both stage files), so
  the format never drifts. **Scope splits by surface:** the PR body is the whole task
  (all layers); a layer write-up is only its own layer. A layer write-up carries a **snapshot** of the
  target program with per-layer ✅/⏳ annotations and **input→output as distinct valid-JSON blocks** —
  **marked-expected**, because nothing is really run until master QA. Alongside it a **cumulative
  session recap** prints after every layer: three tables (layers and their state, issues caught and
  whether they were fixed or deferred, what is next), printed under an escalation too. A deferred issue
  must name the task id it became; "deferred" without an id is how work silently disappears.

  outputty enforces its tools on **real work, not the session**: the `require-environment` PreToolUse
  guard denies file edits outside a git repo (read-only work is never blocked), while the SessionStart
  hook **warns** about a missing GitHub remote, unauthenticated `gh`, or a missing `gh stack` extension.
  **A warning never suppresses the injection.** The hook skips injection entirely for subagents,
  detected from the hook input's `agent_id`/`agent_type`, so only the main session pays for it.

brownfield: |
  **Brownfield.** `bootstrap` reconstructs **all six record sets** from existing docs, docstrings, and
  (optional) commit messages. The user **multi-selects** the scan depth through `AskUserQuestion`, with
  the two cheap sources on by default and the expensive commit-diff scan off, and
  `outputty:outputty-scout` takes any source large enough that its dead ends would cost the session
  context. Every set is written even when the scan found little: an empty set with its header is a real
  answer, a missing file is a hole the next session falls into. It writes product memory only, then
  grills the gaps.

discovery: |
  **Discovery.** The flow acts on an intent the user brings; `audit` supplies the other half —
  *finding* the work worth doing. It's a read-only advisor (adapted from [shadcn/improve](https://github.com/shadcn/improve),
  MIT): recon → effort-scaled parallel audit (Explore agents, nine categories in
  `skills/audit/references/audit-playbook.md`) → vet → a leverage-ranked findings table plus
  separate direction findings. Deliberately **no `plans/` backlog** — outputty keeps one memory surface, so
  findings feed **`roadmap.yaml`** (target-level picks) and **`tasks.js add`** (task-shaped picks), and the
  chosen one **seeds the flow's SPEC**; transient findings are re-found on the next audit (re-auditing
  *is* the backlog). The playbook is also the review-lens library master QA reads for its category
  checks, and it carries only the four structural tags — the reuse ladder itself lives in
  `skills/code-rules/SKILL.md`, one vocabulary, per the protocol's one-word-one-meaning rule.

guards: |
  **Guards.** An unattended build needs deterministic safety rails, and a plugin cannot ship
  `permissions.deny`. Six PreToolUse hooks, registered in `hooks/hooks.json`, with their deny/ask
  patterns in [docs/security.md](docs/security.md):

  | Hook | Matcher | Does |
  | --- | --- | --- |
  | `block-dangerous-commands` | Bash | denies `rm -rf /`, `reset --hard`, force-push, piped remote execution, unqualified `DELETE`; asks on push-to-main |
  | `guard-secret-files` | Read/Edit/Write | hard-denies `.env`, `secrets/`, `*.pem`, `*.key`, `credentials.json` |
  | `scan-secrets` | Edit/Write | asks on credential patterns in content |
  | `require-environment` | Edit/Write | denies an edit outside a git repo |
  | `write-boundary` | Edit/Write | denies an **orchestrator** edit outside `.claude/**` (minus `.claude/trails/**`), `docs/**`, `README.md`; every other role exits silently |
  | `reading-floor` | Bash/Grep/Read | denies `outputty:outputty-master-qa` a fragment read of a file in the diff; a grep outside the changed set is never denied |

  There is **no NotebookEdit matcher** on the Edit/Write hooks, and neither secret hook reads
  `notebook_path`.

  **Never ship a gate that passes on a string an ordinary session already emits.** Two shipped
  PreToolUse gates were deleted on that ground; `lessons.yaml` names each and how it was defeated. Do
  not rebuild either shape. The review gate is a single whole-build **master QA** pass, green-gated at
  start and at merge.

  Diagrams are an **opt-in** `diagram` skill - availability, never a mandate. `documentation` holds the
  README and project-doc ruleset (front-load, routing-hub-not-manual, diagram-only-when-earned); the
  merge step updates the README through it, never by hand. The enforced PR-description format is the
  canonical spec at `skills/outputty/references/pr-description.md`, which carries both the rules and the
  fill-in skeleton. There is no `.github/` template: a plugin install would not carry one into the
  consumer repo. Everything else stays delegated.

