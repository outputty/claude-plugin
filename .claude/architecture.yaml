    kind: feature
    what: "Planning and building are separate stages joined only by the task queue; neither blocks the other."
    how: "`spec: drafting|settled|replan` on a task. `tasks.js ready` is the build queue, `tasks.js planning` its mirror."
    doc: ""
    example: 'bun "${CLAUDE_PLUGIN_ROOT}/skills/outputty/tasks.js" ready'
    related: [Replan iteration, Session stage, Task queue handoff]
  - name: Replan iteration
    kind: feature
    what: "A build that hits a requirements gap sends the task back with evidence instead of asking or guessing."
    how: "It scratches its work, appends an `attempts` entry (`tried` + `killed_by` both required), and sets `spec: replan`."
    doc: ""
    example: ""
    related: [Two-stage flow]
  - name: Session stage
    kind: feature
    what: "Every session is told which stage it is, before its first turn."
    how: "`OUTPUTTY_STAGE`, else `.claude/stage`. `hooks/session.js` injects one stage file plus `shared.md`."
    doc: ""
    example: "echo build > .claude/stage"
